r:"第4课 中古时期的亚洲"},"w-ottoman":{module:"中外历史纲要（下）",chapter:"第4课 中古时期的亚洲"},"w-discovery":{module:"中外历史纲要（下）",chapter:"第6课 全球航路的开辟"},"era-renaissance":{module:"中外历史纲要（下）",chapter:"第8课 欧洲的思想解放运动"},"era-reformation":{module:"中外历史纲要（下）",chapter:"第8课 欧洲的思想解放运动"},"era-enlightenment":{module:"中外历史纲要（下）",chapter:"第8课 欧洲的思想解放运动"},"w-england-rev":{module:"中外历史纲要（下）",chapter:"第9课 资产阶级革命与资本主义制度的确立"},"w-us-rev":{module:"中外历史纲要（下）",chapter:"第9课 资产阶级革命与资本主义制度的确立"},"w-french-rev":{module:"中外历史纲要（下）",chapter:"第9课 资产阶级革命与资本主义制度的确立"},"era-industrial":{module:"中外历史纲要（下）",chapter:"第10课 影响世界的工业革命"},"w-marx":{module:"中外历史纲要（下）",chapter:"第11课 马克思主义的诞生与传播"},"w-ww1":{module:"中外历史纲要（下）",chapter:"第14课 第一次世界大战与战后国际秩序"},"w-oct-rev":{module:"中外历史纲要（下）",chapter:"第15课 十月革命的胜利与苏联的社会主义实践"},"w-ww2":{module:"中外历史纲要（下）",chapter:"第16课 第二次世界大战与战后国际秩序的形成"},"era-coldwar":{module:"中外历史纲要（下）",chapter:"第17课 冷战与国际格局的演变"},"w-cold-end":{module:"中外历史纲要（下）",chapter:"第21课 冷战后的世界格局"}},U0=f=>{if(f.kind!=="era"&&f.kind!=="history"||f.textbooks?.length)return f;const O=C0[f.id];return O?{...f,textbooks:[{stage:"senior",module:O.module,chapter:O.chapter}]}:f},R0=[{id:"m-pythagoras",title:"勾股定理",kind:"law",discipline:"math",track:"world",year:-500,place:"古希腊",summary:"直角三角形两直角边的平方和等于斜边的平方，是几何与代数最早的连接点之一。",detail:"毕达哥拉斯学派据传以百牛祭庆祝，但巴比伦泥板早已记录勾股数。定理的证明比结论更重要——它开启了「演绎」这条路。",sections:[{title:"定理与它的证明",meta:"约前 500",body:"勾股关系在巴比伦、印度、中国都独立出现过。毕达哥拉斯学派的不同之处是给出演绎证明——结论从此不再依赖测量。"},{title:"学派与秘传",body:"毕达哥拉斯学派是个带宗教色彩的组织，数被赋予神秘意义。整数与分数被视为宇宙的秩序。"},{title:"无理数的危机",body:"学派自己发现：正方形对角线与边不可公度。这个「不可说的数」动摇了「万物皆数（整数比）」的信念，史称第一次数学危机。"},{title:"影响",body:"它把「证明」确立为数学的标准。此后两千年，几何都是数学的样板。"}],textbooks:[{stage:"junior",module:"数学八年级下册",chapter:"第十七章 勾股定理"}],tags:["几何","证明"]},{id:"m-euclid",title:"《几何原本》与公理化",kind:"work",discipline:"math",track:"world",year:-300,place:"亚历山大里亚",summary:"从五条公设出发推出全部定理，数学第一次有了「体系」：从公设推出定理。",detail:"欧几里得的贡献是把零散的几何知识组织成演绎链条。此后两千年，「公理—定理」成了理性知识的模板，牛顿的《原理》也照着写。",sections:[{title:"五条公设",meta:"约前 300",body:"①过两点可作一条直线；②线段可延长；③以任意点为心、任意半径可作圆；④所有直角相等；⑤一条直线与两条直线相交，若同侧内角之和小于两个直角，则两直线在该侧延长后必相交。前四条都像「显然」，第五条读起来却像定理。"},{title:"演绎结构",body:"从定义与公设出发，用逻辑推出数百个命题。知识第一次被组织成环环相扣的链条。"},{title:"第五公设的麻烦",body:"它不像前四条那样自明，欧几里得自己也尽量推迟使用它。后世把它改写成更简洁的「过直线外一点，有且只有一条平行线」，即普莱费尔公理。两千年里，无数人想用前四条把它证出来，都失败了——真正的出路要等 19 世纪。"},{title:"传入中国",body:"明末由徐光启与利玛窦合译前六卷，晚清李善兰补译后九卷。「几何」一词沿用至今。"}],textbooks:[{stage:"junior",module:"数学八年级上册",chapter:"第十二章 全等三角形"}],tags:["公理化","演绎"]},{id:"m-trig",title:"三角学与弦表",kind:"concept",discipline:"math",track:"world",year:150,place:"亚历山大里亚",summary:"托勒密编制弦表，把角度与长度对应起来，三角学从天文测量中独立。",detail:"为了算行星位置，需要把角度换算成距离。今天课本里的正弦余弦，最初是天文仪器的「换算表」。",sections:[{title:"为天文而生",meta:"约 150",body:"托勒密需要把角度换算成距离，于是编制弦表：给定圆心角，查出对应的弦长。这是三角函数的雏形。"},{title:"从弦到正弦",body:"印度数学家改用「半弦」定义正弦，数值更便于计算。阿拉伯学者再把正弦、余弦、正切系统化。"},{title:"欧拉的解析化",body:"欧拉把三角函数看成函数而不是线段，并给出 e^{iθ} = cosθ + i sinθ。三角学从此脱离几何，成为分析的一部分。"},{title:"名字的误会",body:"「三角学」听起来只管三角形，其实它是描述周期现象的语言——声波、交流电、量子态都靠它。"}],textbooks:[{stage:"senior",module:"数学必修第一册",chapter:"第五章 三角函数"}],tags:["三角","测量"]},{id:"m-algebra",title:"代数与方程",kind:"theory",discipline:"math",track:"world",year:820,place:"巴格达",summary:"花拉子米系统给出移项与合并同类项的方法，「代数」由此成为独立学科。",detail:"algebra 一词来自 al-jabr（复原/移项）。他把解方程写成可重复的步骤——同一套方法适用于一类题。",sections:[{title:"花拉子米的书",meta:"820",body:"《还原与对消计算概要》系统讨论一次、二次方程的解法。「algebra」一词就来自 al-jabr（还原，即移项）。"},{title:"把解法变成步骤",body:"他不满足于逐题破解，而是把「移项—合并—配方—开方」写成固定流程。这是算法思维第一次进入代数。"},{title:"几何化的论证",body:"解二次方程时，他用正方形与矩形的面积来「证明」配方过程。代数与几何在当时还不分家。"},{title:"传入欧洲",body:"12 世纪被译成拉丁文，成为欧洲大学的教科书。符号化要等韦达与笛卡尔。"}],textbooks:[{stage:"junior",module:"数学七年级上册",chapter:"第三章 一元一次方程"}],tags:["方程","算法"]},{id:"m-fibonacci",title:"数列与递推",kind:"concept",discipline:"math",track:"world",year:1202,place:"比萨",summary:"斐波那契把印度—阿拉伯数字与递推数列带入欧洲，兔子问题成为数列教学的经典入口。",detail:"每一项由前两项相加得到——这是「递推」思想的第一次通俗表达，也是后来差分方程与算法分析的起点。",sections:[{title:"兔子问题",meta:"1202",body:"《计算之书》里有一个问题：一对兔子每月生一对，小兔两个月后也开始生，一年后有多少对？答案是 1,1,2,3,5,8……"},{title:"递推的眼光",body:"每一项等于前两项之和。斐波那契没有给出通项公式，但他把「由前项生成后项」变成了一个可研究的对象。"},{title:"印度数字的引入",body:"这本书更重要的贡献，是把印度—阿拉伯数字与十进位值制引入欧洲。欧洲人后来叫它「斐波那契数列」，其实它早见于印度。"},{title:"为什么它到处出现",body:"花瓣数、松果螺旋、向日葵种子排列都接近这个数列。原因与「最优生长角度」有关，而不是什么神秘法则。"}],textbooks:[{stage:"senior",module:"数学选择性必修第二册",chapter:"第四章 数列"}],tags:["数列","递推"]},{id:"m-complex",title:"复数",kind:"concept",discipline:"math",track:"world",year:1545,place:"米兰",summary:"解三次方程时不得不对负数开平方，虚数从「不可能」变成了必需的工具。",detail:"卡尔达诺在《大术》中写下了它，却称之为「诡辩」。三百年后高斯给出几何解释，复数才被完全接纳。",sections:[{title:"三次方程的尴尬",meta:"1545",body:"解三次方程时，中间步骤常常要对负数开平方；可最后的结果却是实数。数学家用它，却说不清它是什么。"},{title:"虚数单位",body:"欧拉引入 i，规定 i² = −1。复数写成 a+bi，运算规则与实数几乎一样。"},{title:"几何解释",body:"韦塞尔与高斯把复数对应到平面上的点：实部是横坐标，虚部是纵坐标。乘法变成旋转与伸缩。"},{title:"它有什么用",body:"交流电分析、信号处理、量子力学都离不开复数。它从「不可能的数」变成了最实用的工具之一。"}],textbooks:[{stage:"senior",module:"数学必修第二册",chapter:"第七章 复数"}],tags:["数系","扩张"]},{id:"m-log",title:"对数",kind:"concept",discipline:"math",track:"world",year:1614,place:"爱丁堡",summary:"把乘法变成加法，天文学家的计算量因此减少一大半。",detail:"纳皮尔用了二十年编制对数表。拉普拉斯说它「使天文学家的寿命延长了一倍」。",sections:[{title:"纳皮尔的二十年",meta:"1614",body:"为了把乘法变成加法，纳皮尔花了二十年编制对数表。他的出发点是「让计算变快」，不是抽象理论。"},{title:"对数表怎么用",body:"查表得到两个数的对数，相加，再查反对数。天文学家的乘除运算量因此大幅下降。"},{title:"一句被引用无数次的话",body:"拉普拉斯说，对数「使天文学家的寿命延长了一倍」。这不是夸张：当时的计算真的以年计。"},{title:"从工具到函数",body:"欧拉把对数定义为指数函数的反函数，它才成为今天的 y = ln x。计算尺退出历史后，对数函数留了下来。"}],textbooks:[{stage:"senior",module:"数学必修第一册",chapter:"第四章 指数函数与对数函数"}],tags:["运算","计算工具"]},{id:"m-analytic",title:"解析几何与坐标系",kind:"theory",discipline:"math",track:"world",year:1637,place:"荷兰",summary:"用坐标把图形翻译成方程，几何与代数从此可以互相转换。",detail:"笛卡尔在《几何学》中引入坐标系，让「画图」变成「解方程」。这是数学史上最强的一次「翻译」。",sections:[{title:"几何与代数原本分家",meta:"1637",body:"古希腊的几何靠图形与证明，代数靠符号与运算，两条路几乎不相交。笛卡尔想找一种「通用的方法」把两者接起来。"},{title:"坐标系",body:"把平面上的点用一对数表示，曲线就可以写成方程。几何问题变成代数问题，反之亦然。"},{title:"由此打开的",body:"圆锥曲线可以用二次方程统一处理；切线问题、面积问题也有了代数工具。微积分正是沿着这条路长出来的。"},{title:"一个副作用",body:"它让「画图」不再是几何的唯一方式。此后三百年的物理，几乎都是用方程写出来的。"}],textbooks:[{stage:"senior",module:"数学选择性必修第一册",chapter:"第二章 直线和圆的方程"}],tags:["坐标","数形结合"]},{id:"m-probability",title:"概率论",kind:"theory",discipline:"math",track:"world",year:1654,place:"巴黎",summary:"赌局中断如何分钱的问题，催生了概率与期望的概念。",detail:"帕斯卡与费马的通信奠定了古典概率。它后来成为统计、保险与量子力学的语言。",sections:[{title:"赌局中断怎么分钱",meta:"1654",body:"帕斯卡与费马通信讨论一个问题：赌局提前结束时，赌金该按什么比例分？他们用「假设继续赌下去」的期望来算。"},{title:"期望的概念",body:"把每种结果的收益乘以概率再相加。这个量后来成为保险、投资与决策理论的基础。"},{title:"从赌博到科学",body:"惠更斯、伯努利、拉普拉斯把它发展成一门学科。拉普拉斯用它处理天文观测误差。"},{title:"公理化",body:"1933 年柯尔莫哥洛夫用测度论给出公理体系，概率论才成为严格的数学分支。"}],textbooks:[{stage:"senior",module:"数学必修第二册",chapter:"第十章 概率"}],tags:["随机","期望"]},{id:"m-calculus",title:"微积分与导数",kind:"theory",discipline:"math",track:"world",year:1684,place:"莱比锡",summary:"用「无限小」处理变化与累积，数学第一次能精确描述运动。",detail:"牛顿从运动学出发、莱布尼茨从微分符号出发，各自独立发明。今天的 dy/dx 记号来自莱布尼茨。",sections:[{title:"两个古老的问题",meta:"1684",body:"一是求曲线在某点的切线（瞬时变化率），二是求曲线下的面积（累积量）。古代的阿基米德、刘徽都用「逼近」处理过，但没有一般方法。"},{title:"牛顿与莱布尼茨",body:"牛顿从运动学出发，把变化率叫「流数」；莱布尼茨从差分出发，发明了 dy/dx 与积分号。两人独立完成，却为优先权争了半生。"},{title:"为什么记号赢了",body:"莱布尼茨的记号更好用，今天的微积分课本几乎全用他的写法。英国数学界长期沿用牛顿的记号，反而落后了近百年。"},{title:"基础危机",body:"「无限小」到底是什么？贝克莱主教嘲笑它是「消失量的鬼魂」。直到柯西、魏尔斯特拉斯用极限重新定义，微积分才有了严密基础。"}],textbooks:[{stage:"senior",module:"数学选择性必修第二册",chapter:"第五章 一元函数的导数及其应用"}],tags:["变化率","积分"]},{id:"m-function",title:"函数概念的成形",kind:"concept",discipline:"math",track:"world",year:1748,place:"柏林",summary:"欧拉用 f(x) 记号把「对应关系」抽象出来，函数成为数学的中心对象。",detail:"从「曲线」到「对应」，函数概念经过欧拉、柯西、狄利克雷多次收紧，最终摆脱了「必须能用公式写出」的限制。",sections:[{title:"从曲线到对应",meta:"1748",body:"早期函数就是「一条曲线」。欧拉用 f(x) 把函数抽象成一种对应关系，不再依赖图形。"},{title:"狄利克雷的反例",body:"他给出一个函数：有理数取 1，无理数取 0。它无法用公式写出，却完全符合「对应」的定义——函数不必有解析式。"},{title:"定义的收紧",body:"经过柯西、狄利克雷、布尔巴基学派，函数最终被定义为「集合之间的映射」：每个输入对应唯一输出。"},{title:"为什么这个抽象重要",body:"只有把函数当成对象，才能讨论函数的连续性、可导性，乃至「函数的函数」。现代分析学从这里开始。"}],textbooks:[{stage:"senior",module:"数学必修第一册",chapter:"第三章 函数的概念与性质"}],tags:["对应","抽象"]},{id:"m-numbertheory",title:"数论与同余",kind:"theory",discipline:"math",track:"world",year:1801,place:"不伦瑞克",summary:"高斯《算术研究》系统建立同余理论，整数的规律第一次被整理成体系。",detail:"「数学是科学的皇后，数论是数学的皇后」——高斯的这句话概括了这门学问的地位。它今天支撑着密码学。",sections:[{title:"一部「难以读懂」的书",meta:"1801",body:"高斯的《算术研究》系统整理了同余理论。全书极其简洁，据说当年能读懂的人不超过几个。"},{title:"同余的语言",body:"a ≡ b (mod n) 表示两数除以 n 余数相同。这个记号把「整除」问题变成了可以运算的对象。"},{title:"二次互反律",body:"高斯称之为「黄金定理」：它告诉我们两个素数之间「谁是模谁的二次剩余」。他一生给出八个证明。"},{title:"它今天用在哪",body:"RSA 加密、哈希、纠错码都建立在大整数分解与模运算之上。数论从「最纯粹的数学」变成了信息安全的地基。"}],textbooks:[{stage:"advanced",module:"大学先修·初等数论"}],tags:["整数","同余"]},{id:"m-limit",title:"极限的严格化",kind:"theory",discipline:"math",track:"world",year:1821,place:"巴黎",summary:"柯西用「无限接近」代替「无限小」，微积分从直觉走向严密。",detail:"此前贝克莱大主教嘲笑无穷小是「消失量的鬼魂」。ε-δ 语言的出现，让分析学有了可靠地基。",sections:[{title:"要回答的问题",meta:"1821",body:"微积分用了一百多年，但「无限小」到底是什么，一直没人说清。柯西要做的不是修补，而是给它换一个定义。"},{title:"柯西的做法",body:"柯西把极限定义为：变量可以无限接近某个值，但不一定达到。导数与积分都建立在极限之上，而不是无穷小之上。"},{title:"ε-δ 语言",body:"魏尔斯特拉斯把「无限接近」写成不等式：对任意 ε>0，存在 δ>0……。分析学从此不用再谈「无穷小是什么」。"},{title:"代价与收益",body:"代价是直观性下降，初学者要花很久才能适应。收益是严密性：此后的分析定理都可以被证明，而不是被「看出来」。"}],textbooks:[{stage:"senior",module:"数学选择性必修第二册",chapter:"第五章 一元函数的导数及其应用"}],tags:["分析","严密化"]},{id:"m-noneuclid",title:"非欧几何",kind:"theory",discipline:"math",track:"world",year:1829,place:"喀山",summary:"否定第五公设也能构造自洽几何，人们第一次意识到「数学不只有一种」。",detail:"罗巴切夫斯基的平行公设替代方案曾被当成笑话。几十年后它成了广义相对论的几何语言。",sections:[{title:"从证明到替换",meta:"1829",body:"前人要么想用前四条推出第五公设，要么把它改写成更顺眼的等价说法。罗巴切夫斯基换了个动作：直接把它替换成相反的公设，然后看会推出什么。"},{title:"换个方向",body:"罗巴切夫斯基假设「过直线外一点有无数条平行线」，推出一整套几何，没有出现矛盾——只是违反直觉。"},{title:"鲍耶与高斯",body:"鲍耶独立得到同样结论，写信给高斯；高斯回信说「我早想到了，但不敢发表」。三人各自抵达，只有罗巴切夫斯基先公开。"},{title:"黎曼与相对论",body:"黎曼把曲率推广到任意维度，为广义相对论提供了语言。爱因斯坦的时空，就是一套非欧几何。"}],textbooks:[{stage:"advanced",module:"大学先修·几何学"}],tags:["公理","空间"]},{id:"m-vector",title:"向量",kind:"concept",discipline:"math",track:"world",year:1844,place:"都柏林",summary:"既有大小又有方向的量，把几何问题变成可计算的代数运算。",detail:"哈密顿从四元数中提炼出向量。今天它在物理（力、场）与计算机图形学里无处不在。",sections:[{title:"从四元数说起",meta:"1844",body:"哈密顿想为三维空间找一种「复数」，结果造出了四元数。向量的概念是从四元数里剥出来的。"},{title:"吉布斯与亥维赛",body:"两人各自把四元数拆成「标量部分」与「向量部分」，发展出点积、叉积与向量分析。数学界一度很反感。"},{title:"物理学家接受了它",body:"麦克斯韦方程用向量写起来极其简洁。工程师与物理学家先接受，数学家后来才跟上。"},{title:"今天的向量",body:"课本里的「有大小有方向」，只是它最浅的一层。更本质的说法是：向量是向量空间里的元素。"}],textbooks:[{stage:"senior",module:"数学必修第二册",chapter:"第六章 平面向量及其应用"}],tags:["向量","运算"]},{id:"m-set",title:"集合论",kind:"theory",discipline:"math",track:"world",year:1874,place:"哈雷",summary:"康托尔用集合定义「无限」，数学的基础被重新审视。",detail:"他证明实数比自然数「多」，也发现了悖论。二十世纪数学的每一次地基讨论，都要从集合论说起。",sections:[{title:"无穷带来的麻烦",meta:"1874",body:"伽利略早就发现：自然数与平方数可以一一对应，虽然平方数「看起来更少」。无穷集合不能再用「部分小于整体」来判断大小。"},{title:"对角线法",body:"康托尔用对角线论证证明：实数不能与自然数一一对应。于是无穷也有大小之分，实数比自然数「更多」。"},{title:"悖论出现",body:"罗素构造了「所有不包含自身的集合组成的集合」——它包含自身当且仅当它不包含自身。集合论的地基裂了缝。"},{title:"公理化补救",body:"策梅洛与弗兰克尔建立 ZF 公理系统，限制「什么样的集合可以存在」。今天的数学仍建立在这套地基上。"}],textbooks:[{stage:"senior",module:"数学必修第一册",chapter:"第一章 集合与常用逻辑用语"}],tags:["无限","基础"]},{id:"m-zhoubi",title:"《周髀算经》与勾股",kind:"work",discipline:"math",track:"cn",year:-100,place:"中原",summary:"记载「勾三股四弦五」，中国最早的勾股定理文本证据。",detail:"商高与周公的对话形式，说明它最初是天文测量的实用知识，服务于历法与工程。",sections:[{title:"一部什么样的书",meta:"约前 100",body:"《周髀算经》以商高与周公的对话开篇，内容是天文学与测量术，不是纯几何著作。"},{title:"勾三股四弦五",body:"书中记「勾三股四弦五」，并给出「勾股各自乘，并而开方除之」的算法。结论对，但没有演绎证明。"},{title:"用来做什么",body:"算日影、定节气、测远近。数学在这里是工具，服务于历法与王权。"},{title:"与希腊的对照",body:"同一时期，希腊人在写《几何原本》。差别不在谁先发现，而在「知识如何被组织」：一个是算法手册，一个是公理体系。"}],textbooks:[{stage:"junior",module:"数学八年级下册",chapter:"第十七章 勾股定理"}],tags:["勾股","测量"]},{id:"m-nine-chapters",title:"《九章算术》",kind:"work",discipline:"math",track:"cn",year:-100,place:"中原",summary:"以 246 道应用题组织数学，方程、分数与比例算法成体系。",detail:"它不追求公理化，而是追求「算法可用」。这种风格与《几何原本》形成鲜明对照，也塑造了中国数学的传统。",sections:[{title:"九个章节",meta:"约前 100",body:"全书按问题类型分九章：方田、粟米、衰分、少广、商功、均输、盈不足、方程、勾股。从土地丈量到家畜买卖，几乎全是应用题。"},{title:"算法而非证明",body:"每题给出「问—答—术」：问题、答案、算法。它不解释为什么对，只保证照着做能算出结果。"},{title:"方程术",body:"「方程」章用筹算排列系数，通过消元求解线性方程组——本质上是高斯消元法，比欧洲早了一千多年。"},{title:"影响",body:"它奠定了中国数学「算法化、实用化」的传统，也影响了朝鲜与日本。"}],textbooks:[{stage:"junior",module:"数学七年级上册",chapter:"第三章 一元一次方程"}],tags:["算法","应用"]},{id:"m-liuhui",title:"刘徽割圆术",kind:"concept",discipline:"math",track:"cn",year:263,place:"魏晋",summary:"用正多边形不断逼近圆，「割之弥细，所失弥少」，极限思想的东方表达。",detail:"刘徽给出 3.1416 的近似，并明确说出了「无限逼近」的道理。祖冲之在此基础上把精度推到七位。",sections:[{title:"注《九章》",meta:"263",body:"刘徽为《九章算术》作注，补上了原书缺失的「为什么」。他的注本身成了独立的数学著作。"},{title:"割圆术",body:"用圆内接正多边形逼近圆：从正六边形开始，边数不断加倍，周长趋近圆周长。他说「割之弥细，所失弥少」。"},{title:"极限的味道",body:"他算出 3.1416，并明确表达「无限逼近」的思想。这比欧洲的同类表述早了一千多年。"},{title:"被祖冲之接住",body:"祖冲之沿用这套方法，把精度推到小数点后七位。方法比结果更长寿。"}],textbooks:[{stage:"junior",module:"数学九年级上册",chapter:"第二十四章 圆"}],tags:["极限","圆周率"]},{id:"m-qin-jiushao",title:"秦九韶与高次方程",kind:"work",discipline:"math",track:"cn",year:1247,place:"四川",summary:"《数书九章》给出高次方程数值解法与大衍求一术，算法水准领先欧洲数百年。",detail:"他的「正负开方术」与今天的秦九韶—霍纳算法一致。中国古代数学的长处，正是这种可执行的计算程序。",sections:[{title:"《数书九章》",meta:"1247",body:"全书十八卷、八十一题，涵盖田亩、赋税、工程、军事。秦九韶是个官员，数学对他而言是治理工具。"},{title:"高次方程的数值解",body:"他给出「正负开方术」，可以逐位逼近高次方程的根。算法与今天的霍纳法一致。"},{title:"大衍求一术",body:"一次同余方程组的解法，与今天数论中的中国剩余定理同源。"},{title:"算法传统的高峰",body:"他的工作代表中国古代数学的最高水平之一：不追求公理，但把「能算出来」做到极致。"}],textbooks:[{stage:"junior",module:"数学九年级上册",chapter:"第二十一章 一元二次方程"}],tags:["算法","方程"]},{id:"m-yanghui",title:"杨辉三角",kind:"concept",discipline:"math",track:"cn",year:1261,place:"南宋",summary:"二项式系数排成的三角阵列，杨辉记录并解释了它的构造规律。",detail:"同一张表在波斯、欧洲都独立出现过（帕斯卡三角）。它同时连着组合数、概率与数列。",sections:[{title:"一张表的来历",meta:"1261",body:"杨辉在《详解九章算法》中记录了一张三角形数表，并说明它出自贾宪。这是中国最早的二项式系数表。"},{title:"垛积术",body:"他研究堆垛物体的计数：方垛、三角垛、梯形垛，各有求和公式。这是高阶等差数列求和的早期形式。"},{title:"与帕斯卡三角",body:"同一张表在波斯、欧洲都独立出现过。帕斯卡 1654 年用它研究概率，名字由此挂在了欧洲版本上。"},{title:"它为什么重要",body:"每一行是二项式展开的系数，也是组合数。它同时连着代数、概率与数列——一个入口，三条路。"}],textbooks:[{stage:"senior",module:"数学选择性必修第三册",chapter:"第六章 计数原理"}],tags:["组合","二项式"]}],H0=[{id:"h-yangshao",title:"仰韶文化",kind:"era",discipline:"chemistry",track:"cn",year:-5e3,yearEnd:-3e3,place:"黄河中游",summary:"彩陶、粟作与聚落，是中国史前最有辨识度的一支考古文化。",detail:"半坡、庙底沟两个类型影响范围极广。彩陶纹样不只是装饰，也承担着族群标识与交流的功能。",sections:[{title:"彩陶为什么重要",meta:"约前 5000—前 3000",body:"仰韶的彩陶不只是容器：纹样在不同聚落间传播、模仿、变形，说明存在跨区域的交流网络。"},{title:"半坡与庙底沟",body:"半坡类型以人面鱼纹、鱼鸟纹著称；庙底沟类型的花瓣纹影响范围极大，从关中一直扩散到中原与北方。"},{title:"聚落告诉我们什么",body:"环壕、公共墓地、成排房址，说明有稳定的定居与集体组织；随葬品的差异则显示社会分层已经开始。"},{title:"命名的由来",body:"「仰韶」来自河南渑池仰韶村，1921 年首次发掘。中国现代考古学，就是从这个小村庄开始的。"}],tags:["历史","考古"]},{id:"h-liangzhu",title:"良渚文化",kind:"era",discipline:"chemistry",track:"cn",year:-3300,yearEnd:-2300,place:"长江下游（今浙江余杭）",summary:"玉礼器、古城与水利系统，被视为早期国家形态的有力证据。",detail:"良渚的玉琮上刻有统一的神人兽面纹，说明存在跨区域的信仰与权力象征；大型水坝需要长期的组织动员。",sections:[{title:"玉器与信仰",meta:"约前 3300—前 2300",body:"玉琮、玉璧、玉钺不是装饰品，而是礼器。琮上统一的神人兽面纹，说明存在跨聚落的共同信仰与权力象征。"},{title:"古城与水利",body:"良渚古城有城墙、宫殿区与外围水利系统。水坝需要长期组织人力，这是「动员能力」的硬证据。"},{title:"它算不算「国家」",body:"学界有争论：有人认为已进入早期国家，有人坚持只是复杂酋邦。争论的焦点是「城市、文字、青铜」这套标准是否唯一。"},{title:"为什么它被反复提起",body:"良渚实证了中华文明「多元起源」：长江下游与黄河流域一样，独立发展出了复杂社会。"}],tags:["历史","考古","玉器"]},{id:"h-longshan",title:"龙山文化",kind:"era",discipline:"chemistry",track:"cn",year:-3e3,yearEnd:-1900,place:"黄河中下游",summary:"黑陶、城址与文字雏形，社会分层明显加深。",detail:"蛋壳陶薄如纸，需要高温窑与高超的轮制技术。陶文符号虽未被完全解读，但已接近文字的边界。",sections:[{title:"黑陶与温度控制",meta:"约前 3000—前 1900",body:"蛋壳陶薄如纸，需要高温窑与高超的轮制技术，还要控制渗碳还原气氛。它代表史前制陶的顶峰。"},{title:"城址与战争",body:"龙山时代城址大量出现，城墙、壕沟、乱葬坑并存。这暗示一个更频繁冲突、更需要防御的社会。"},{title:"陶文",body:"部分陶器上有刻划符号，被认为与文字起源有关，但尚未被解读。它停在「符号」与「文字」之间。"},{title:"向中原汇聚",body:"各区域文化在龙山时代加速交流，中原逐渐成为核心。夏商周的国家，正是在这个基础上出现的。"}],tags:["历史","考古","黑陶"]}],q0=[...j0,..._0,...A0,...M0,...D0,...R0,...H0].map(U0),Y0=[{from:"w-archimedes",to:"w-galileo",type:"inspire",note:"阿基米德式的测量与推理传统被重新拾起"},{from:"era-renaissance",to:"w-galileo",type:"context",note:"实验哲学与赞助人网络"},{from:"era-renaissance",to:"w-kepler",type:"context"},{from:"w-galileo",to:"w-kepler",type:"inspire",note:"惯性思想影响天体运动的重新解释"},{from:"w-kepler",to:"w-newton",type:"inspire",note:"行星定律成为万有引力的检验对象"},{from:"w-galileo",to:"w-newton",type:"inspire",note:"惯性与加速度概念的直接前身"},{from:"era-renaissance",to:"w-newton",type:"context"},{from:"w-democritus",to:"w-dalton",type:"inspire",note:"原子论在 2200 年后获得定量形式"},{from:"w-lavoisier",to:"w-dalton",type:"inspire",note:"定量关系需要「不可分的粒子」来解释"},{from:"w-dalton",to:"w-avogadro",type:"inspire",note:"原子与分子必须区分才能解释气体体积比"},{from:"w-avogadro",to:"w-mendeleev",type:"inspire",note:"原子量测定让周期排列成为可能"},{from:"w-dalton",to:"w-mendeleev",type:"inspire"},{fr

的学术共同体。这些观察停留在「记载」层面，没有形成可推演的体系。"},{title:"与希腊的对照",body:"同一时期，希腊人也在研究光，但欧几里得把光学写成公理演绎的《光学》。差别不在观察，而在「如何组织知识」。"}],textbooks:[{stage:"junior",module:"物理八年级上册",chapter:"光现象"},{stage:"senior",module:"物理选择性必修第一册",chapter:"光的直线传播"}],tags:["光学","实验传统"]},{id:"cn-zhangheng-seismo",title:"候风地动仪",kind:"invention",discipline:"physics",track:"cn",year:132,place:"洛阳",summary:"张衡造候风地动仪，以机械结构感知地震方向，是早期把力学原理用于观测的尝试。",detail:"地动仪利用惯性摆动触发机关，使对应方向的龙口吐出铜丸。它的意义不只在「测震」，更在于把物理直觉固化成可重复运行的装置。",sections:[{title:"东汉的地震",meta:"132",body:"东汉地震频繁，朝廷需要判断震中方向以安排赈灾。张衡的任务不是「预测地震」，而是「尽快判断哪里震了」。"},{title:"仪器怎么工作",body:"都柱（中心摆）受地震波推动，触发对应方向的机关，龙口吐丸落入蟾蜍口中。八个方向，哪个方向落丸，就是震源方向。"},{title:"一次著名的记录",body:"史载有一次仪器发动但洛阳无感，众人不信；几天后陇西报告地震，方向吻合。这是它最著名的一次「验证」。"},{title:"争议与意义",body:"现代复原模型能否真正工作仍有争论。它的价值不在于精度，而在于「把力学直觉做成可重复运行的装置」这个思路。"}],textbooks:[{stage:"senior",module:"物理必修第一册",chapter:"力与运动"}],tags:["力学","仪器"]},{id:"cn-shenkuo",title:"沈括与磁偏角",kind:"concept",discipline:"physics",track:"cn",year:1088,place:"润州（今江苏镇江）",summary:"《梦溪笔谈》记载指南针「常微偏东」，是世界上最早的磁偏角记录之一。",detail:"沈括比较了水浮、指爪、碗唇、缕悬四种支撑方式，指出缕悬最可靠，并记录了磁针不指正南。观察被写下、被引用，才成为可积累的知识。",era:{politics:"北宋变法与边防压力",society:"士大夫兼治技术与政务的传统"},sections:[{title:"一部笔记里的科学",meta:"1088",body:"《梦溪笔谈》是沈括晚年被贬后所写，六百多条笔记，涉及天文、地理、数学、医药、工程。它不是专著，却保存了大量第一手观察。"},{title:"磁偏角的记录",body:"他指出指南针「常微偏东，不全南也」。这是世界上最早的磁偏角明确记载之一，比欧洲早约四百年。"},{title:"四种支法",body:"他比较了水浮、指爪、碗唇、缕悬四种支撑磁针的方法，认为缕悬最可靠。这是实验方法论的雏形：控制变量、比较优劣。"},{title:"为什么重要",body:"沈括的价值在于「记录并比较」。中国古代技术经验丰富，但像他这样系统写下方法与误差的人不多。"}],textbooks:[{stage:"senior",module:"物理必修第三册",chapter:"第十三章 电磁感应与电磁波初步"}],tags:["地磁","观测","笔记"]},{id:"cn-gunpowder",title:"火药的发明与传播",kind:"invention",discipline:"chemistry",track:"cn",year:808,place:"唐",summary:"现存最早的火药配方记载（808 年）：硫黄、硝石与木炭混合，一次「失败实验」改变了战争与化学史。",detail:"808 年《太上圣祖金丹秘诀》记下了硫黄、硝石与木炭的配比，是目前所见最早的火药配方。火药源于炼丹求长生，却在燃烧与爆炸中被重新认识；它随蒙古西征传入阿拉伯与欧洲，成为火炮技术与矿业需求的一部分，也间接推动了燃烧与爆炸的定量研究。",era:{politics:"唐末藩镇割据，宋代边患与城防需求",technology:"炼丹炉、冶金与配比经验积累"},sections:[{title:"最早的配方",meta:"808",body:"《太上圣祖金丹秘诀》记下硫黄、硝石与木炭的配比，这是目前所见最早的火药配方。炼丹者求的是长生，得到的却是爆炸。"},{title:"为什么它会炸",body:"硝石是氧化剂，硫黄与木炭是燃料。受热后反应在极短时间内放出大量气体与热，体积骤增——这是固体化学里最剧烈的一类反应。"},{title:"从方术到武器",body:"宋代出现火药武器，元代传入阿拉伯与欧洲。欧洲人把它装进火炮，反过来改变了攻城与海战的规则。"},{title:"余音",body:"它从丹炉走向战场，再随火炮回到东方。"}],textbooks:[{stage:"junior",module:"化学九年级上册",chapter:"燃料及其利用"}],tags:["化学工艺","技术传播"]},{id:"cn-bencao",title:"《本草纲目》",kind:"work",discipline:"chemistry",track:"cn",year:1596,place:"湖北蕲州",summary:"李时珍系统整理药物、性状与炮制方法，是传统药物化学经验的一次大汇总。",detail:"全书载药 1892 种，按「部—类—种」分类，记录了蒸馏、升华、沉淀等操作。书成于 1578 年，1596 年金陵刻本首次刊行——时间轴上取的是刊行年。它不以理论见长，但提供了大量可检验的物质性质与制备经验。",era:{society:"明代商品经济与刻书业繁荣，医者游历采方成风"},sections:[{title:"李时珍为什么写它",meta:"1596",body:"他三次乡试不中，转而行医。读旧本草时发现分类混乱、药名重复、甚至有毒性记载错误，于是决定重编一部。"},{title:"分类的方法",body:"全书按「部—类—种」三级编排，从水、火、土、金石到草、谷、菜、果、木，再到虫、鳞、介、禽、兽、人。这是一种基于自然属性的分类，而不是按药效罗列。"},{title:"里面的化学经验",body:"记录了蒸馏、升华、结晶、沉淀等操作，也记下不少物质的性质与制备。比如制取铅丹、提炼水银、烧制石灰——都是可重复的工艺。"},{title:"它的边界",body:"它总结的是经验，不是理论。为什么有效、为什么会反应，书中给不出解释。真正的化学解释要等拉瓦锡与道尔顿。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第八章 化学与可持续发展"}],tags:["药物","分类","经验化学"]},{id:"cn-tiangong-kaiwu",title:"《天工开物》",kind:"work",discipline:"chemistry",track:"cn",year:1637,place:"江西奉新",summary:"宋应星记录冶铸、造纸、制盐、染色等工艺，是古代技术化学的百科全书。",detail:"书中对炼锌（倭铅）、灌钢、黄铜制备的记载，包含了对物质变化的观察与配比经验。它的价值在于把分散的工匠知识写成了可传承的文本。",era:{politics:"明末社会动荡，实学思潮兴起",technology:"手工业分工细化，冶铁与陶瓷技术成熟"},sections:[{title:"一个屡试不第的人",meta:"1637",body:"宋应星五次会试不中，转而关注「实学」。他走遍工场田间，记录下当时最实用的技术。"},{title:"写了什么",body:"全书十八卷，从谷物加工、制盐、制糖，到陶瓷、冶铸、造纸、染色、酿酒。几乎覆盖了当时所有的手工业门类。"},{title:"两处关键技术",body:"一是炼锌：书中记载用「倭铅」（锌）与铜制黄铜，这是世界上较早的炼锌记录；二是灌钢法：把生铁与熟铁合炼，控制含碳量。"},{title:"它的命运",body:"书成后影响有限，清中叶一度失传，直到近代才从日本回传。技术写得再细，没有理论支撑，也难长成科学。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第三章 铁 金属材料"}],tags:["冶金","工艺","实学"]},{id:"cn-lishanlan",title:"李善兰译《重学》",kind:"work",discipline:"physics",track:"cn",year:1859,place:"上海",summary:"与伟烈亚力合译《重学》，首次系统引入牛顿力学，是「西学东渐」在物理上的落点。",detail:"《重学》译自英国力学教材，把力、动量、功等概念带入中文语境。译名的选择（如「重学」对应 mechanics）影响了此后数十年的物理术语体系。",era:{politics:"第二次鸦片战争后，洋务运动兴起",society:"江南制造局翻译馆聚集中外学者"},sections:[{title:"一个懂算学的译者",meta:"1859",body:"李善兰是清代少有的数学人才，创「尖锥术」处理无穷小问题。他要译的不是普通读物，而是力学体系。"},{title:"《重学》译了什么",body:"与伟烈亚力合译英国力学教材，系统引入力、动量、功、能量等概念。这是牛顿力学第一次以完整体系进入中文。"},{title:"造词之难",body:"「重学」对应 mechanics，「质点」「加速度」等词都要新造。译名一旦确立，就规定了后来者怎么理解这门学问。"},{title:"影响",body:"《重学》成为洋务学堂的教科书，也影响了日本。徐寿译化学、李善兰译物理，是「西学东渐」在科学上的两条主线。"}],textbooks:[{stage:"senior",module:"物理必修第一册",chapter:"序言"}],tags:["译介","西学东渐","术语"]},{id:"cn-xushou",title:"徐寿译《化学鉴原》",kind:"work",discipline:"chemistry",track:"cn",year:1871,place:"上海",summary:"系统译介西方近代化学，并与傅兰雅共创元素中文命名法，今天的「钠、钾、镁」多源于此。",detail:"徐寿以「取偏旁表状态、取声旁表音」的原则造字命名元素，使化学知识第一次拥有了可持续的中文表达。命名法本身就是一次知识基础设施的建设。",era:{politics:"洋务运动「师夷长技」，江南制造局设翻译馆",society:"科举之外的新学读者群出现"},sections:[{title:"背景：江南制造局",body:"洋务运动办厂需要懂技术的人，翻译馆因此设立。徐寿与英国人傅兰雅合作，系统翻译化学、矿冶与工艺书籍。"},{title:"元素中文命名的难题",body:"元素名无法意译，音译又太长。徐寿定下原则：金属用「金」旁、非金属用「石」旁或「气」头，取西文首音作声旁——「钠」「钾」「镁」「氯」由此而来。"},{title:"影响有多远",body:"这套命名法也被日本早期化学书借鉴，并沿用至今。它让化学第一次有了可读、可写、可教的中文表达。"},{title:"翻译的难处",body:"不只是换语言：概念没有对应词时，要造词；单位、实验描述、公式排版都要重建。译者是知识基础设施的建造者。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第一章 物质及其变化"}],tags:["译介","元素命名","西学东渐"]},{id:"cn-solvay",title:"侯德榜与联合制碱法",kind:"invention",discipline:"chemistry",track:"cn",year:1943,place:"四川五通桥",summary:"在索尔维法与永利碱厂经验之上，把制碱与合成氨联合，提高食盐利用率并减少废液。",detail:"侯德榜的贡献是工程与化学的结合：他重新组织流程，让副产物成为原料。这种「流程思维」是化学工业的核心能力。注意区分两个时间点：1926 年塘沽永利碱厂投产（索尔维法），1943 年才完成联合制碱法。",era:{politics:"民族工业在夹缝中求存",technology:"合成氨技术刚成熟，纯碱仍是战略物资"},sections:[{title:"两个时间点要分清",meta:"1926 / 1943",body:"1926 年塘沽永利碱厂投产，用的是索尔维法；1943 年在四川五通桥完成联合制碱法。不要把两者混为一谈。"},{title:"改造的切口",body:"他没有换反应，而是换流程：把制碱与合成氨放进同一个厂，让氨厂提供氨与二氧化碳，制碱副产的氯化铵直接做成肥料。"},{title:"收益与代价",body:"食盐利用率从约 70% 提到 90% 以上，废液大幅减少；代价是流程耦合更紧，一个环节波动会传遍全厂，对控制要求极高。"},{title:"意义",body:"这是一次流程再造。侯德榜的贡献属于「化学工程」——让每一步的副产物成为下一步的原料。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第五章 化工生产中的重要非金属元素"}],tags:["化工","流程","自主创新"]},{id:"cn-tuyouyou",title:"青蒿素的发现",kind:"invention",discipline:"chemistry",track:"cn",year:1972,place:"北京",summary:"从《肘后备急方》的低温提取线索出发，屠呦呦团队分离出青蒿素，开创抗疟新药。",detail:"关键突破来自对传统文献的重新解读：高温煎煮破坏有效成分，改用乙醚低温提取才得到活性物质。这是「传统经验 + 现代方法」的典型样本。",era:{politics:"援越抗美背景下的抗疟任务（523 项目）",society:"大规模协作的科研组织方式"},sections:[{title:"523 项目",meta:"1967—1972",body:"抗疟任务在援越背景下启动（1967 年 5 月 23 日定名「523」），全国数十家单位协作，筛查了数千个方剂与化合物。"},{title:"古籍给的线索",body:"《肘后备急方》记载「青蒿一握，以水二升渍，绞取汁」——注意是「渍」不是「煮」，暗示高温会破坏有效成分。"},{title:"低温提取",body:"改用乙醚低温提取，得到对疟原虫抑制率接近 100% 的提取物，1972 年分离出青蒿素晶体。"},{title:"结构与应用",body:"青蒿素含过氧桥结构，是全新类型的抗疟药。2015 年屠呦呦获诺贝尔生理学或医学奖。"},{title:"余音",body:"2015 年她领奖时 84 岁，距离那次乙醚低温提取，已经 43 年。"}],textbooks:[{stage:"senior",module:"化学选择性必修第三册",chapter:"第三章 烃的衍生物"}],tags:["天然产物","提取","传统与科学"]},{id:"cn-atomic-bomb",title:"第一颗原子弹爆炸",kind:"event",discipline:"physics",track:"cn",year:1964,place:"新疆罗布泊",summary:"中国在极端困难的条件下完成核试验，背后是核物理、材料与工程体系的整体突破。",detail:"从理论计算到铀浓缩、从爆轰设计到测量诊断，这是一次「大科学」实践。它说明现代物理的进展高度依赖组织能力与工业基础，而不只是个别天才。",era:{politics:"冷战格局、技术封锁与国家安全压力",technology:"铀同位素分离、精密测量与计算能力"},sections:[{title:"为什么叫「大科学」",meta:"1964",body:"从理论计算到铀浓缩、从爆轰设计到测量诊断，任何一环掉链子，整件事就不成立。它考验的不只是物理，还有组织、材料与工业能力。"},{title:"难在三个地方",body:"一是铀同位素分离：铀-235 只占天然铀的 0.7%，要提纯到武器级；二是内爆式爆轰的精确同步；三是没有超级计算机的年代，靠手摇计算器与算盘完成海量数值计算。"},{title:"1964 年 10 月 16 日",body:"罗布泊上空升起蘑菇云。中国成为第五个拥有核武器的国家，从立项到首次试验用了不到十年。"},{title:"余音",body:"罗布泊上空的那朵云，来自 1911 年卢瑟福在曼彻斯特看见的那种力量。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第五章 原子核"}],tags:["核物理","大科学"]}],j0=[{id:"w-democritus",title:"德谟克利特的原子论",titleEn:"Democritus: atomism",kind:"theory",discipline:"chemistry",track:"world",year:-400,place:"古希腊阿布德拉",summary:"万物由不可分的「原子」与虚空构成——一个纯思辨的猜想，等了 2200 年才被实验检验。",detail:"德谟克利特没有实验，只有逻辑：若物质无限可分，则终将化为虚无；故必有不可分的最小单元。这个论证在近代被道尔顿以定量方式重建。",era:{society:"希腊城邦的哲学论辩传统"},sections:[{title:"纯思辨的原子论",meta:"约前 400",body:"德谟克利特没有实验，只有论证：若物质可以无限分割，最后会化为虚无；既然世界还在，就必有不可分的最小单元。他把这叫作「原子」，把空隙叫作「虚空」。"},{title:"与近代原子论的区别",body:"他的原子没有质量、没有结构，也不可检验。道尔顿的原子有确定的相对质量，可以被称量——差别不在「有没有原子」，而在「能不能算」。"},{title:"为什么它被冷落两千年",body:"亚里士多德的四元素说更符合日常经验，又被中世纪神学吸收。原子论只是一条被记住的旁支，直到 19 世纪才被重新捡起。"},{title:"价值在哪",body:"它示范了一种思维方式：用不可见的微观结构解释可见的现象。这个思路后来成了整个物理化学的底色。"}],textbooks:[{stage:"junior",module:"化学九年级上册",chapter:"物质构成的奥秘"}],tags:["原子论","思辨"]},{id:"w-archimedes",title:"阿基米德浮力原理",titleEn:"Archimedes: buoyancy",kind:"law",discipline:"physics",track:"world",year:-250,place:"叙拉古",summary:"浸在流体中的物体受到向上的浮力，大小等于排开流体的重量——第一次把「感觉」变成可计算的关系。",detail:"阿基米德从「王冠是否掺假」的实际问题出发，用排水体积与重量之比给出判据。这是把测量与推理结合的早期范例。",sections:[{title:"王冠与排水",meta:"约前 250",body:"国王怀疑金冠掺银，要阿基米德鉴定又不能损坏。他在洗澡时想到：物体浸入水中排开的水量，与它的体积有关。"},{title:"浮力原理",body:"浸在流体中的物体受到的浮力，等于它排开流体的重量。这条关系把「感觉到的轻」变成了可以称量的量。"},{title:"杠杆与机械",body:"他系统研究杠杆平衡，说出「给我一个支点，我能撬动地球」。叙拉古守城时，他用杠杆与滑轮设计防御器械。"},{title:"方法论上的意义",body:"他把数学证明与物理测量结合起来：先假设，再推导，再用实验检验。两千年后伽利略走的还是这条路。"}],textbooks:[{stage:"junior",module:"物理八年级下册",chapter:"浮力"}],tags:["流体","测量"]},{id:"w-solvay",title:"索尔维制碱法",kind:"invention",discipline:"chemistry",track:"world",year:1861,place:"比利时",summary:"以氨碱法实现纯碱的连续化生产，把实验室反应变成了可规模化的工业流程。",detail:"索尔维法解决了路布兰法污染大、成本高的问题，成为现代纯碱工业的基础。侯德榜的联合制碱法正是对它的再改进。",era:{technology:"工业革命后的化工需求与设备能力"},sections:[{title:"路布兰法的困境",meta:"1861",body:"早期的路布兰法用盐、硫酸、煤制碱，副产大量氯化氢与硫化钙，污染重、成本高。工厂周围寸草不生。"},{title:"氨碱法的原理",body:"索尔维用氨、二氧化碳与食盐水反应，生成碳酸氢钠沉淀，再煅烧得纯碱。氨与二氧化碳循环使用，副产氯化钙。"},{title:"连续化生产",body:"索尔维法的价值在于「连续」：原料不断进、产品不断出。这是化工与实验室反应的根本区别。"},{title:"它的位置",body:"氨碱法在此后一个世纪里都是纯碱生产的主流。它的两个弱点——食盐利用率与废液——到 20 世纪才被另一种流程正面解决。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第五章 化工生产中的重要非金属元素"}],tags:["化工","流程"]},{id:"w-galileo",title:"伽利略的自由落体研究",titleEn:"Galileo: falling bodies",kind:"law",discipline:"physics",track:"world",year:1604,place:"意大利帕多瓦",summary:"用斜面实验与数学描述推翻「重物落得快」，确立了「实验 + 数学」的近代物理方法。",detail:"伽利略把难以测量的自由落体「稀释」成斜面运动，用时间与距离的比例关系检验假设。方法上的创新比结论本身影响更深远。",era:{society:"文艺复兴后期，实验哲学兴起",technology:"望远镜、摆与精密计时雏形"},sections:[{title:"要反驳的是什么",body:"亚里士多德认为「重的物体落得快」，这符合日常直觉：石头比羽毛快。后世常引用的反驳是：把轻重两物绑在一起，究竟该更快还是更慢？两头都不通。（这个论证常被归于伽利略，但史料归属有争议。）"},{title:"斜面实验怎么做",body:"自由落体太快、当时没有精密计时器。伽利略让铜球沿倾斜的木板滚下，把运动「稀释」到可以用水钟计时的程度，再改变倾角外推。"},{title:"结论：s ∝ t²",body:"他发现小球在相等时间内通过的位移之比是 1:3:5:7，总位移与时间平方成正比——这就是匀加速运动。倾角越大越快，外推到竖直就是自由落体。"},{title:"教会为什么翻脸",body:"1616 年《天体运行论》被列入禁书目录，伽利略被警告不得把日心说当作事实宣讲。1632 年他出版《关于两大世界体系的对话》，用讽刺笔法让支持地心说的角色显得愚蠢——这触怒了乌尔班八世，而此人曾是他的朋友。1633 年审判，伽利略被迫悔罪，改判软禁。"},{title:"方法论上的意义",body:"「把不可测的量转化为可测的量」是伽利略最持久的贡献。实验在他手里成了一次被设计出来的提问。"}],textbooks:[{stage:"senior",module:"物理必修第一册",chapter:"第二章 匀变速直线运动的研究"}],tags:["实验方法","运动学"]},{id:"w-kepler",title:"开普勒行星运动三定律",kind:"law",discipline:"physics",track:"world",year:1609,place:"布拉格",summary:"行星沿椭圆轨道运行，面积速度恒定，周期与半长轴成 3/2 次方关系。",detail:"开普勒从第谷的观测数据中「拟合」出规律，抛弃了圆轨道的先验假设。这是数据驱动科学的早期胜利，也为牛顿提供了关键约束。",era:{technology:"第谷的精密观测数据"},sections:[{title:"从圆到椭圆",body:"古希腊以来，天体被认为必须走正圆——因为圆最完美。开普勒反复拟合第谷的火星数据，发现圆轨道总有 8 角分的偏差，最终承认轨道是椭圆。"},{title:"三定律的内容",body:"①行星沿椭圆轨道运行，太阳在一个焦点；②面积速度不变（近快远慢）；③周期的平方与半长轴的立方成正比。第三条把不同行星统一在一个公式里。"},{title:"数据的力量",body:"第谷二十年肉眼观测达到角分级精度，开普勒在此基础上做了数年的计算。没有那份数据，就没有这三条定律——这是「观测—拟合」的典范。"},{title:"留给牛顿的问题",body:"开普勒只说「怎么运动」，没说「为什么」。这个「为什么」由牛顿的平方反比律回答，也把天文学正式纳入物理学。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["天体力学","数据"]},{id:"w-newton",title:"牛顿运动定律与万有引力",titleEn:"Newton: Principia",kind:"law",discipline:"physics",track:"world",year:1687,place:"英国剑桥",summary:"三条运动定律加万有引力，把天上与地上的运动统一进同一套数学框架。",detail:"《自然哲学的数学原理》用几何论证给出体系。它的力量在于「统一」：苹果落地与月亮绕地是同一种相互作用。此后两百年，力学成为科学的样板。",era:{politics:"英国君主立宪确立，皇家学会制度化科学",society:"科学共同体与期刊通信网络形成"},sections:[{title:"三条定律分别在说什么",meta:"1687",body:"第一定律定义「惯性」——不受力则保持匀速直线运动；第二定律给出 F=ma，把力与加速度定量连起来；第三定律说明作用与反作用成对出现。三条合起来，第一次让「运动」可以被计算。"},{title:"万有引力与「月地检验」",body:"牛顿假设使苹果落地的力与维持月亮绕地的力是同一种力，并用月球的向心加速度与地面重力加速度之比来检验，结果与平方反比律吻合。这个「统一」是《原理》最震撼的地方。"},{title:"与开普勒的关系",body:"开普勒从数据里总结出行星定律，但没有解释「为什么」。牛顿用平方反比律推出椭圆轨道，把「经验规律」变成了「理论推论」——这正是近代物理的方法论转折。"},{title:"为什么它是范式",body:"《原理》用公理—命题—推论的结构写物理，此后两百年，其他学科都在模仿这种「数学化的自然哲学」。直到相对论与量子力学出现，它的边界才被划出来。"}],textbooks:[{stage:"senior",module:"物理必修第一册",chapter:"第四章 运动和力的关系"}],tags:["经典力学","统一"]},{id:"w-lavoisier",title:"拉瓦锡与质量守恒",kind:"law",discipline:"chemistry",track:"world",year:1789,place:"法国巴黎",summary:"用精密天平证明化学反应前后质量不变，并推翻燃素说，确立近代化学的定量基础。",detail:"拉瓦锡的关键在实验设计：「封闭体系 + 定量核算」。天平只是工具。他把化学从定性描述变成可计算的科学。",era:{politics:"法国大革命前夕，科学院体系成熟",technology:"精密天平与气体收集装置"},sections:[{title:"燃素说的困境",body:"燃素说认为燃烧是物质释放「燃素」。但金属燃烧后变重，燃素若跑掉，理应变轻——这个矛盾困扰了化学一百年。"},{title:"封闭体系与天平",body:"拉瓦锡把反应放进密闭容器，称量反应前后的总质量。他发现总质量不变，而气体参与了反应——「变重」是因为吸收了空气中的某种成分（氧气）。"},{title:"质量守恒定律",body:"在封闭体系中，反应前后物质总质量不变。这条今天看来「理所当然」的定律，是定量化学的起点：它让化学方程式可以配平。"},{title:"死因：包税人身份",body:"1794 年 5 月 8 日，拉瓦锡与另外 27 名包税人（向王室包办税收的金融集团）一起被革命法庭判处死刑，当天送上断头台，罪名是包税舞弊与「危害人民」。他本人正是旧制度的受益者——包税人、火药总监、度量衡改革委员。审判记录里没有出现他的化学研究。"}],textbooks:[{stage:"junior",module:"化学九年级上册",chapter:"质量守恒定律"}],tags:["定量化学","燃素说"]},{id:"w-dalton",title:"道尔顿原子论",kind:"theory",discipline:"chemistry",track:"world",year:1803,place:"英国曼彻斯特",summary:"原子有确定的相对质量，化合物由原子按整数比结合——原子论第一次可以被定量检验。",detail:"道尔顿从气体分压与倍比定律出发，提出原子量表。虽然后来发现分子与同位素，这套框架仍是化学计量的基础。",era:{technology:"气体实验与称量精度提升"},sections:[{title:"从倍比定律出发",body:"两种元素生成多种化合物时，与相同质量甲元素结合的乙元素质量成简单整数比。这个规律强烈暗示：物质由「一个个」粒子组成。"},{title:"原子量",body:"道尔顿给每种原子定了一个相对质量（以氢为 1），并列出第一张原子量表。虽然数值粗糙，但「原子有重量」从此可检验。"},{title:"局限在哪里",body:"道尔顿认为原子不可分、单质都是单原子分子，导致分子量计算混乱。阿伏伽德罗的分子假说补上了这一块。"},{title:"为什么重要",body:"它把化学从「性质描述」变成「计量科学」。今天的化学方程式、摩尔、化学计量，都建立在这套框架上。"}],textbooks:[{stage:"junior",module:"化学九年级上册",chapter:"物质构成的奥秘"}],tags:["原子论","化学计量"]},{id:"w-avogadro",title:"阿伏伽德罗分子假说",kind:"theory",discipline:"chemistry",track:"world",year:1811,place:"意大利都灵",summary:"同温同压下同体积气体含相同数目的分子，由此区分了原子与分子。",detail:"假说当时被冷落近半个世纪，直到分子量测定与气体反应体积比吻合才被接受。它解释了「氢与氯合成氯化氢为何是 1:1」。",sections:[{title:"气体体积比的怪事",body:"氢与氯按 1:1 体积比生成氯化氢，生成物体积也与反应物相同。若气体都是单原子，反应后原子数应减半，矛盾。"},{title:"原子与分子要分开",body:"阿伏伽德罗提出：同温同压下同体积气体含相同数目的分子；单质气体由双原子分子组成（H₂、Cl₂）。这样体积比就说得通了。"},{title:"为什么被冷落半个世纪",body:"当时原子论与分子论混用，术语混乱；加上权威（道尔顿）反对，假说长期被忽视。"},{title:"卡尔斯鲁厄的转折",body:"1860 年国际化学会议统一了原子量标准，坎尼扎罗系统阐述了阿伏伽德罗的假说，此后「分子」才被普遍接受。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第二章 海水中的重要元素——钠和氯"}],tags:["分子","气体"]},{id:"w-wohler",title:"维勒人工合成尿素",kind:"experiment",discipline:"chemistry",track:"world",year:1828,place:"德国柏林",summary:"用无机物氰酸铵合成尿素，动摇了「有机物只能由生命力产生」的观念。",detail:"维勒本人并未立刻宣布推翻活力论，但这次合成让「有机物 = 生命专属」的界线开始松动，为有机化学的独立发展打开空间。",era:{society:"自然哲学与活力论仍占主流"},sections:[{title:"活力论的背景",meta:"1828",body:"当时主流认为有机物只能由生命体产生，因为合成它需要一种神秘的「活力」。无机物与有机物之间有一道不可逾越的界线。"},{title:"实验",body:"维勒把氰酸铵溶液加热，得到的是尿素——一种原本只能从尿液里提取的有机物。无机物变成了有机物。"},{title:"他自己的谨慎",body:"维勒没有立刻宣布推翻活力论，只是写信告诉导师「我不用肾脏就能造出尿素」。措辞克制，但意义已经很清楚了。"},{title:"影响",body:"这道界线被打破后，有机化学成为一门可以「合成」的学科。今天的人工合成药物、塑料、纤维，都站在这条路上。"}],textbooks:[{stage:"senior",module:"化学选择性必修第三册",chapter:"第一章 有机化合物的结构特点与研究方法"}],tags:["有机化学","活力论"]},{id:"w-faraday",title:"法拉第电磁感应",kind:"law",discipline:"physics",track:"world",year:1831,place:"英国伦敦",summary:"变化的磁场产生电流，把「电」与「磁」连成一体，直接催生了发电机。",detail:"法拉第没有受过系统数学训练，他用「力线」图像描述场。这个直觉图像后来被麦克斯韦翻译成方程。",era:{technology:"电池、电磁铁与精密线圈工艺"},sections:[{title:"现象本身",body:"把磁铁插入或拔出线圈，电流计指针偏转；磁铁静止时指针回零。关键在于磁通量的改变：磁铁静止时不产生电动势，只有变化才有。"},{title:"法拉第的力线",body:"法拉第没有受过系统的数学训练，他用「力线」这种图像来思考：磁铁周围布满看不见的线，导线切割这些线就产生电流。这个图像后来成了「场」的概念。"},{title:"留下一个问题：方向",body:"法拉第知道「有电」，却说不出电流往哪边流。这个空白留给下一位——楞次。"},{title:"直接催生发电机",body:"让线圈在磁场中持续转动，就能持续发电。今天的火力、水力、风力发电，原理都是 1831 年这个实验。"},{title:"余音",body:"他两次拒绝爵士头衔，也拒绝了皇家学会主席的位置，晚年仍在皇家研究院的地下室里做实验。"}],textbooks:[{stage:"senior",module:"物理选择性必修第二册",chapter:"第二章 电磁感应"}],tags:["电磁学","场"]},{id:"w-joule",title:"焦耳与能量守恒",kind:"law",discipline:"physics",track:"world",year:1843,place:"英国曼彻斯特",summary:"用桨叶搅拌实验测出热功当量，证明热是能量的一种形式。",detail:"焦耳反复改进测量精度，用几十种方式做同一件事。能量守恒后来成为贯穿物理、化学、生物的共同原理。",era:{technology:"蒸汽机效率问题驱动热学研究"},sections:[{title:"热到底是什么",meta:"1843",body:"当时主流认为热是一种流体（热质）。焦耳怀疑：热也许是能量的一种形式，可以做功，也可以由功产生。"},{title:"桨叶实验",body:"重物下落带动叶片搅拌水，测量水温升高。他算出：使 1 磅水升温 1℉ 所需的功是一个固定值——热功当量。"},{title:"精度与坚持",body:"他反复改进测量，用不同方法做同一件事，几十年不间断。最初的数值与今天相差不到百分之几。"},{title:"意义",body:"能量守恒从此有了实验基础。热、功、电、化学能可以互相转化——这是 19 世纪物理学最重要的统一。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第八章 机械能守恒定律"}],tags:["热力学","能量"]},{id:"w-maxwell",title:"麦克斯韦电磁场理论",kind:"theory",discipline:"physics",track:"world",year:1865,place:"英国",summary:"四个方程统一电、磁、光，并预言电磁波以光速传播。",detail:"麦克斯韦把法拉第的力线写成微分方程，发现光就是电磁波。这是理论预言先于实验发现的经典案例（赫兹 1888 年验证）。",era:{society:"数学物理在英国兴起"},sections:[{title:"四个方程在说什么",body:"高斯定律（电荷产生电场）、高斯磁定律（没有磁单极）、法拉第定律（变化的磁场产生电场）、安培—麦克斯韦定律（电流与变化的电场产生磁场）。四句话概括了经典电磁学。"},{title:"位移电流：最关键的一笔",body:"麦克斯韦发现安培定律在电容器充电时不成立，于是补上「位移电流」项。这一项让电场变化也能产生磁场，方程组才自洽。"},{title:"光是电磁波",body:"方程解出电磁波的速度恰好等于光速，麦克斯韦据此断言光就是电磁波。二十三年后赫兹用火花实验证实。"},{title:"对相对论的启发",body:"麦克斯韦方程给出的光速是一个常数，不随参考系改变；这与牛顿力学的速度叠加直接冲突。爱因斯坦选择保留前者、改掉后者。"}],textbooks:[{stage:"senior",module:"物理选择性必修第二册",chapter:"第四章 电磁振荡与电磁波"}],tags:["统一","电磁波","理论预言"]},{id:"w-mendeleev",title:"门捷列夫元素周期律",kind:"law",discipline:"chemistry",track:"world",year:1869,place:"俄国圣彼得堡",summary:"按原子量排列元素，性质呈周期性变化，并留下空位预言未发现的元素。",detail:"门捷列夫的胆识在于敢改原子量、敢留空位。后来镓、锗、钪的发现与预言吻合，周期律才被真正接受。",era:{technology:"光谱分析与原子量测定积累"},sections:[{title:"排列的依据",body:"门捷列夫把已知的 63 种元素按原子量排列，发现性质会周期性重复——于是把相似性质的元素放进同一列，形成周期表。"},{title:"敢留空位",body:"遇到「放不进去」的地方，他不在规则上妥协，而是留下空格，并预言那里应有未被发现的元素（类铝、类硅）。"},{title:"预言的验证",body:"1875 年镓、1886 年锗被发现，性质与预言高度吻合。周期律因此从「排列技巧」变成「自然规律」。"},{title:"后来的修正",body:"1913 年莫塞莱证明决定排序的是原子序数（核电荷数）。周期表的结构因此更清晰，但门捷列夫的框架依然成立。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第四章 物质结构 元素周期律"}],tags:["周期律","预言"]},{id:"w-arrhenius",title:"阿伦尼乌斯电离理论",kind:"theory",discipline:"chemistry",track:"world",year:1884,place:"瑞典乌普萨拉",summary:"电解质在水中自发解离为离子，解释了溶液的导电与依数性。",detail:"理论最初被质疑为「荒谬」，后来成为酸碱理论、电化学与化学平衡的基础。",sections:[{title:"溶液为什么导电",meta:"1884",body:"盐溶液能导电，但纯水与纯盐都不导。当时认为电流是「电解」产生的，需要外加电压才会解离。"},{title:"电离理论",body:"阿伦尼乌斯主张：电解质在水中自发解离成离子，无需通电。导电是因为溶液里本来就有自由离子。"},{title:"被导师反对",body:"他的博士论文在答辩时被质疑为「荒谬」，勉强通过。几年后，渗透压与依数性的实验支持了理论。"},{title:"后续影响",body:"电离理论成为酸碱理论、化学平衡与电化学的基础。1903 年他因此获诺贝尔化学奖。"}],textbooks:[{stage:"senior",module:"化学选择性必修第一册",chapter:"第三章 水溶液中的离子反应与平衡"}],tags:["电离","溶液"]},{id:"w-lechatelier",title:"勒夏特列原理",kind:"law",discipline:"chemistry",track:"world",year:1884,place:"法国巴黎",summary:"平衡体系受外界改变时，会向减弱这种改变的方向移动。",detail:"这条经验规律为合成氨等工业反应提供了调节思路，后来被热力学严格化。",sections:[{title:"平衡是什么",meta:"1884",body:"可逆反应达到平衡时，正逆反应速率相等，各物质浓度不再变化。它是动态的：反应仍在进行，只是两个方向一样快。"},{title:"原理的表述",body:"改变影响平衡的条件（浓度、压强、温度），平衡会向减弱这种改变的方向移动。这是经验规律，后来被热力学严格化。"},{title:"工业上的应用",body:"合成氨要在低温（利于平衡）与高温（利于速率）之间折中，还要及时移走氨。勒夏特列原理提供了调节思路。"},{title:"局限",body:"它是定性规律，给不出定量结果，也不适用于远离平衡的体系。真正的计算要靠平衡常数与热力学。"}],textbooks:[{stage:"senior",module:"化学选择性必修第一册",chapter:"第二章 化学反应速率与化学平衡"}],tags:["化学平衡","工业"]},{id:"w-rontgen",title:"伦琴发现 X 射线",kind:"experiment",discipline:"physics",track:"world",year:1895,place:"德国维尔茨堡",summary:"阴极射线管旁的荧光屏发光，引出一种能穿透物质的新射线。",detail:"伦琴用「未知」命名（X），并系统检验其穿透性与摄影效果。几个月内 X 射线就进入医学诊断，是基础发现快速转化的典型。",sections:[{title:"一次被留下的实验",meta:"1895",body:"伦琴用黑纸包住阴极射线管，却在旁边的荧光屏上看到微光。他没有忽略，而是连续几周待在实验室里追查。"},{title:"能穿透什么",body:"这种射线能穿过纸、木、肌肉，却被骨骼挡住。他拍下妻子手的照片，骨骼清晰可见。"},{title:"为什么叫 X",body:"他不知道这是什么，就用数学里表示未知的 X 命名。这个名字一直留到今天。"},{title:"迅速改变医学",body:"几个月内，X 射线就用于诊断骨折与异物。1901 年首届诺贝尔物理学奖颁给了伦琴，他把奖金捐给了大学。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["射线","医学应用"]},{id:"w-thomson",title:"汤姆孙发现电子",kind:"experiment",discipline:"physics",track:"world",year:1897,place:"英国剑桥",summary:"用阴极射线的荷质比测量证明存在比原子更小的带负电粒子。",detail:"汤姆孙测出了电子的荷质比 e/m，并提出「葡萄干布丁模型」。电荷量的精确测定要等到 1909 年密立根的油滴实验。原子不可分的观念从此被打破。",sections:[{title:"阴极射线是什么",meta:"1897",body:"真空管通电后从阴极射出射线。它能被磁场偏转，说明带电；但它是「粒子」还是「以太波」，当时争论激烈。"},{title:"测荷质比",body:"汤姆孙用磁场与电场的组合让射线偏转平衡，测出电子的荷质比约为氢离子的 1836 倍——粒子极轻且带负电。"},{title:"葡萄干布丁模型",body:"他设想正电荷均匀分布、电子嵌在其中。这是第一个有内部结构的原子模型，虽然后来被散射实验推翻。"},{title:"打开的盒子",body:"「原子不可分」被打破，电子成为第一个被确认的基本粒子。此后原子结构、放射性、量子论接连登场。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["电子","原子结构"]},{id:"w-curie",title:"居里夫妇与放射性",kind:"experiment",discipline:"chemistry",track:"world",year:1898,place:"法国巴黎",summary:"从沥青铀矿中分离出钋与镭，证明放射性来自原子本身。",detail:"数吨矿石、数月萃取，只为得到零点几克氯化镭。放射性不仅改变物理，也让化学分离技术与辐射防护起步。",era:{society:"科学界对「新元素」的竞争与协作"},sections:[{title:"贝克勒尔的意外",meta:"1896—1898",body:"贝克勒尔发现铀盐能自发发出穿透性射线，不需要光照。这提示放射性源自原子内部。"},{title:"沥青铀矿的异常",body:"居里夫妇发现沥青铀矿的放射性比纯铀还强，推断其中含有未知的强放射性元素。"},{title:"分离钋与镭",body:"他们处理数吨矿石，用沉淀与分级结晶反复富集，终于分离出钋与镭。这是化学分离技术的极限挑战。"},{title:"代价与影响",body:"长期辐射暴露损害了居里夫人的健康；而放射性成为核物理、医学与地质年代学的起点。"},{title:"余音",body:"1934 年，她死于再生障碍性贫血。她的实验笔记本至今仍有放射性，被收在铅衬的盒子里。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第四章 物质结构 元素周期律"}],tags:["放射性","分离"]},{id:"w-planck",title:"普朗克量子假说",kind:"theory",discipline:"physics",track:"world",year:1900,place:"德国柏林",summary:"能量只能以离散的「量子」形式吸收与发射，解决了黑体辐射的紫外灾难。",detail:"普朗克自己起初只把它当数学技巧。五年后爱因斯坦用它解释光电效应，量子概念才真正动摇经典物理。",sections:[{title:"紫外灾难",meta:"1900",body:"经典理论预测黑体辐射在短波处能量趋于无穷，与实验完全不符。这个「灾难」说明经典电磁学与热力学在微观尺度上出了问题。"},{title:"能量子的假设",body:"普朗克假设能量只能一份一份地发射与吸收，每份 E=hν。这个「不得已」的数学技巧，恰好拟合了实验曲线。"},{title:"普朗克自己的犹豫",body:"他起初认为量子化只是数学手段，试图回到经典解释。真正把量子当物理实在的是爱因斯坦。"},{title:"从技巧到革命",body:"1905 年爱因斯坦用光量子解释光电效应，1913 年玻尔用量子化解释原子。二十五年后，量子力学建立。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["量子","黑体辐射"]},{id:"w-einstein",title:"爱因斯坦相对论",kind:"theory",discipline:"physics",track:"world",year:1905,place:"瑞士伯尔尼",summary:"狭义相对论统一时间与空间，质能关系 E=mc² 揭示质量与能量的等价。",detail:"1905 年「奇迹年」的四篇论文分别涉及光电效应、布朗运动、狭义相对论与质能等价。1915 年广义相对论进一步把引力解释为时空弯曲。",sections:[{title:"两个公设",body:"狭义相对论建立在两条假设上：物理规律在所有惯性系中相同；真空光速与光源、观察者的运动无关。由这两条推出时间与空间不再是绝对的。"},{title:"同时性的相对性",body:"两个事件是否「同时」，取决于观察者的运动状态。时间膨胀、长度收缩都是真实的测量效应，由此而来。"},{title:"质能方程",body:"E=mc² 说明质量与能量是同一事物的两种形态。它解释了放射性为何释放巨大能量，也成为核能的理论依据。"},{title:"广义相对论与验证",body:"1915 年把引力解释为时空弯曲。1919 年日食观测到星光偏折，爱因斯坦一夜成名。今天 GPS 每天都在做相对论修正。"},{title:"余音",body:"1939 年，他签署了一封提醒罗斯福注意核裂变的信。1945 年 8 月 6 日，广岛。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["相对论","时空"]},{id:"w-rutherford",title:"卢瑟福核式结构模型",kind:"experiment",discipline:"physics",track:"world",year:1911,place:"英国曼彻斯特",summary:"α 粒子散射实验发现少数粒子大角度偏转，推断原子中心有极小的高密度核。",detail:"「像用炮弹轰击薄纸，却发现偶尔被弹回来」。这一结果否定了均匀分布模型，开启了原子核物理。",sections:[{title:"汤姆孙模型会预测什么",meta:"1911",body:"若正电荷像布丁一样均匀分布，α 粒子穿过时只会轻微偏转，几乎不可能被弹回。这是「葡萄干布丁模型」的可检验预言。"},{title:"实验怎么做",body:"用 α 粒子轰击极薄金箔，用荧光屏记录散射角度。盖革与马斯登统计了数以万计的粒子。"},{title:"大角度散射意味着什么",body:"极少数粒子偏转超过 90°，甚至被弹回。卢瑟福说这像「用炮弹打纸却弹回来」——说明原子中心有极小、极重、带正电的核。"},{title:"模型留下的困难",body:"核式模型无法解释电子为何不坠入核、光谱为何离散。这两个问题把物理学推向量子论。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["散射","原子核"]},{id:"w-bohr",title:"玻尔氢原子模型",kind:"theory",discipline:"physics",track:"world",year:1913,place:"丹麦哥本哈根",summary:"引入量子化轨道与能级跃迁，成功解释氢原子光谱的离散谱线。",detail:"玻尔把普朗克的量子概念搬进原子，是「旧量子论」的巅峰。它保留了经典轨道，最终被量子力学取代，但从这里开始，光谱成了探测原子的工具。",sections:[{title:"经典物理为什么解释不了原子",meta:"1913",body:"按经典电动力学，绕核运动的电子会持续辐射能量，极短时间内就该坠入原子核。可原子是稳定的——这说明经典理论在原子尺度失效。"},{title:"玻尔的三条假设",body:"①电子只能在特定轨道上运动，不辐射；②轨道角动量量子化；③跃迁时吸收或放出固定能量的光子。用量子条件「禁止」了经典辐射。"},{title:"解释氢光谱",body:"氢原子光谱是离散的线系。玻尔用能级差算出巴尔末系的波长，与实验吻合得惊人——理论第一次精确命中光谱数据。"},{title:"局限与遗产",body:"它保留了「轨道」这个经典图像，只能处理氢原子。但「能级」「跃迁」成了量子力学的通用语言。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["能级","光谱"]},{id:"w-debroglie",title:"德布罗意物质波",kind:"theory",discipline:"physics",track:"world",year:1924,place:"法国巴黎",summary:"一切粒子都有波动性，波长与动量成反比。",detail:"德布罗意的博士论文把对称性推到底：既然光既是波又是粒子，电子为何不能？三年后电子衍射实验证实了它。",sections:[{title:"对称性的追问",meta:"1924",body:"光既是波又是粒子。德布罗意反问：既然波能表现为粒子，粒子为什么不能表现为波？"},{title:"波长公式",body:"λ = h/p。动量越大，波长越短——所以宏观物体的波动性完全不可察觉，而电子在原子尺度上显著。"},{title:"实验验证",body:"1927 年戴维孙—革末用电子束轰击镍晶体，得到衍射图样；G.P. 汤姆孙用薄膜也观察到电子衍射。"},{title:"推动量子力学",body:"物质波的想法直接启发薛定谔写出波动方程。量子力学的基本图像由此成形。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"}],tags:["波粒二象性","对称"]},{id:"w-heisenberg",title:"量子力学的建立",kind:"theory",discipline:"physics",track:"world",year:1925,place:"德国哥廷根",summary:"矩阵力学与波动方程先后建立，用概率与算符取代轨道，重塑了微观世界的描述方式。",detail:"海森堡的矩阵力学与薛定谔的波动力学形式不同却等价。不确定性原理与统计诠释随之而来，经典「轨迹」概念在原子尺度上失效。",era:{society:"一战后的欧洲物理学中心转移"},sections:[{title:"矩阵力学",meta:"1925",body:"海森堡放弃「电子轨道」这种不可观测的图像，只用可观测的跃迁频率与强度建立方程。数学形式是矩阵。"},{title:"不确定性原理",body:"位置与动量不能同时精确确定：Δx·Δp ≥ ℏ/2。这不是仪器不够好，而是自然界的性质。"},{title:"哥本哈根诠释",body:"波函数描述概率，测量导致「坍缩」。这套解释成为教科书标准，但爱因斯坦至死不满：「上帝不掷骰子。」"},{title:"争论的意义",body:"EPR 佯谬与贝尔不等式把哲学争论变成了实验问题。2022 年诺贝尔奖颁给了纠缠实验——这场争论至今没有结束。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第四章 原子结构和波粒二象性"},{stage:"advanced",module:"大学先修·量子力学初步"}],tags:["量子力学","概率"]}],A0=[{id:"era-renaissance",title:"文艺复兴与科学革命",kind:"era",discipline:"physics",track:"world",year:1400,yearEnd:1687,place:"欧洲",summary:"从「权威解释」转向「观察 + 数学」，科学共同体与印刷术一起改变了知识生产的方式。",detail:"印刷术降低了知识复制成本，航海与天文观测提出新问题，大学与学会提供制度空间。伽利略、开普勒、牛顿都站在这个结构之上。",era:{politics:"城邦与民族国家竞争，赞助人制度",society:"人文主义与宗教改革",technology:"印刷术、望远镜、摆钟"},sections:[{title:"人文主义",meta:"1400—1687",body:"「人的价值」被重新提起：绘画画人、文学写人、解剖学研究人。神仍是中心，但观察的目光转向了尘世。"},{title:"印刷术与赞助人",body:"印刷让一本书的成本骤降，美第奇家族这样的赞助人养着艺术家与学者。知识生产第一次有了「市场 + 资助」的双轨。"},{title:"回到古典",body:"希腊罗马的文本被重新发现、校勘、翻译。托勒密的《天文学大成》、欧几里得的《几何原本》都经由这条路径回到欧洲。"},{title:"它留下了什么",body:"不是某一项发现，而是一套态度：用观察与数学解释自然，而不是引用权威。科学革命从这套态度里长出来。"}],tags:["科学革命"]},{id:"era-industrial",title:"工业革命",kind:"era",discipline:"chemistry",track:"world",year:1760,yearEnd:1840,place:"英国",summary:"蒸汽机、纺织与化工需求，让「效率」成为科学问题，热学与化学因此加速。",detail:"蒸汽机效率催生热力学；漂白、制碱、染料的工业需求催生化学工艺。科学与产业第一次形成稳定回路。",era:{politics:"资本主义扩张与殖民贸易",technology:"蒸汽机、冶金、化工装置"},sections:[{title:"从纺织开始",meta:"1760—1840",body:"飞梭、珍妮机、水力纺纱机把纺织从家庭手工业变成工厂生产。蒸汽机随后提供了不受地点限制的动力。"},{title:"工厂制度",body:"机器要求集中、按时、分工。工人从农田走进车间，时间被钟表切割——这是一种全新的生活秩序。"},{title:"城市化",body:"曼彻斯特人口在几十年里翻了数倍。拥挤、污染、疾病随之而来，也催生了公共卫生与城市规划。"},{title:"科学与产业",body:"早期发明多来自工匠经验，而非科学理论。热力学反而是被蒸汽机「逼」出来的——技术先跑，科学后追。"}],tags:["产业","需求驱动"]},{id:"era-xixue",title:"西学东渐",kind:"era",discipline:"chemistry",track:"cn",year:1840,yearEnd:1900,place:"中国",summary:"翻译馆、新学堂与留学生把近代科学整体搬进中文世界，术语与教材随之重建。",detail:"从《重学》《化学鉴原》到京师同文馆，知识是成体系的移植：概念、仪器、命名法、教学方法一起进来。",era:{politics:"鸦片战争后的洋务运动与维新变法",society:"科举之外的新学读者与报馆"},sections:[{title:"从技术到制度",meta:"1840—1900",body:"最初只学船炮，后来发现船炮背后是数学、化学与工厂制度。译书范围随之扩大。"},{title:"翻译馆与学堂",body:"江南制造局翻译馆、京师同文馆、福州船政学堂。译书、办学、派留学，三件事同时进行。"},{title:"术语的建立",body:"元素命名、力学名词、化学式写法，都要在中文里重新造。术语一旦确立，就规定了后来者怎么理解。"},{title:"局限",body:"引进的是结论，不是方法；学的是技术，不是科学共同体。真正的研究传统，要到民国大学与研究所才出现。"}],tags:["译介","制度"]},{id:"era-coldwar",title:"冷战与「两弹一星」",kind:"era",discipline:"physics",track:"cn",year:1950,yearEnd:1970,place:"中国",summary:"国家安全压力下的举国体制，把核物理、航天与材料科学在短时间内推到可用状态。",detail:"大科学工程需要理论、实验、工程与组织的耦合。它的遗产不只是产品，还有一整套科研协作与人才培养体系。",era:{politics:"冷战、技术封锁与国防需求",technology:"铀浓缩、计算与精密制造"},sections:[{title:"铁幕",meta:"1950—1970",body:"丘吉尔的「铁幕」演说、杜鲁门主义、马歇尔计划。欧洲被一分为二，世界进入两极对抗。"},{title:"核威慑",body:"美苏核武库不断扩张，「相互确保摧毁」反而维持了恐怖平衡。古巴导弹危机把世界推到边缘。"},{title:"太空竞赛",body:"斯普特尼克、加加林、阿波罗。太空成了国力与制度的展示场，也带动了材料、计算与通信。"},{title:"对科学的影响",body:"冷战给基础研究提供了空前资金，也把科学家卷入政治。奥本海默的遭遇是一个缩影。"}],tags:["大科学","体制"]},{id:"era-greek-polis",title:"希腊城邦制度",kind:"era",discipline:"physics",track:"world",year:-800,yearEnd:-338,place:"爱琴海沿岸",summary:"数百个独立小邦以公民兵、议事会与广场论辩维生，为「讲道理」而不是「听权威」的知识传统提供了土壤。",detail:"城邦规模小，公民彼此相识，公共事务靠演说与辩论决定。几何学、天文学与自然哲学在这里被当作说服工具，而不是祭司的秘传。",era:{politics:"公民大会、议事会与抽签任职",society:"公民/妇女/奴隶的分层，公共生活高度发达",technology:"航海、度量与建筑技术"},sections:[{title:"地理塑造的城邦",meta:"约前 800—前 338",body:"希腊多山、海岸破碎，难以形成大一统帝国，于是出现数百个独立小邦。每个城邦有自己的法律、神祇与军队。"},{title:"公民与奴隶",body:"城邦的主体是公民：成年男性自由人。妇女、外邦人与奴隶被排除在政治之外——民主的自由，建立在别人的不自由上。"},{title:"广场上的辩论",body:"公共事务靠演说决定，说服能力成了硬通货。修辞学、逻辑学、自然哲学都从这种需求里长出来。"},{title:"城邦的局限",body:"小邦之间长期内战，最终被马其顿吞并。城邦提供了自由，却没能提供更大的秩序。"}],tags:["历史","制度"]},{id:"era-athenian-democracy",title:"雅典民主政治",kind:"era",discipline:"physics",track:"world",year:-508,yearEnd:-322,place:"雅典",summary:"克利斯提尼改革确立民主，公民大会成为最高权力机构——辩论需要逻辑，逻辑催生了论证的科学。",detail:"抽签选官、陶片放逐、陪审法庭，这套制度把「用理由说服人」变成了日常技能。诡辩派与苏格拉底都从这套土壤里长出来。",era:{politics:"直接民主、抽签与陪审",society:"公民政治参与度高，外邦人与奴隶被排除"},sections:[{title:"克利斯提尼的改革",meta:"前 508—前 322",body:"他按地域重新划分部落，打散旧贵族的关系网；设五百人议事会，用抽签产生。民主的地基由此奠定。"},{title:"抽签与陪审",body:"多数公职抽签产生，陪审法庭由公民组成。民主的意思是：普通人不只投票，还直接执政与审判。"},{title:"陶片放逐",body:"公民投票决定放逐谁，得票最多者离开城邦十年。这是防止个人独裁的机制，也常被用于派系斗争。"},{title:"谁不在场",body:"妇女、奴隶、外邦人没有政治权利。雅典民主是「公民内部的民主」，这一点常被浪漫化的叙述略过。"}],tags:["历史","制度","民主"]},{id:"era-alexander",title:"亚历山大东征与希腊化",kind:"era",discipline:"physics",track:"world",year:-334,yearEnd:-323,place:"波斯至印度河流域",summary:"军队把希腊学术带到埃及与两河，亚历山大里亚成为新的知识中心。",detail:"东征本身是征服，副产品是知识的流动：几何学、天文学、医学在亚历山大里亚汇集。阿基米德、欧几里得、埃拉托色尼都站在这个网络里。",era:{politics:"帝国分裂为托勒密、塞琉古等王国",society:"希腊语成为学术通用语"},sections:[{title:"东征",meta:"前 334—前 323",body:"亚历山大从马其顿出发，十年间打到印度河流域。他死后帝国立刻分裂，但东征打开的空间没有关闭。"},{title:"亚历山大里亚",body:"托勒密王朝建城、建图书馆与缪斯宫。这里成为地中海世界的学术中心，欧几里得、阿基米德、埃拉托色尼都与之相关。"},{title:"希腊化",body:"希腊语成为学术通用语，希腊几何与巴比伦天文、埃及医学混合。知识第一次在这么大的范围内流动。"},{title:"遗产",body:"「希腊化」不是希腊文化的胜利，而是杂交。罗马继承的，正是这个混合体。"}],tags:["历史","传播"]},{id:"era-roman-law",title:"罗马法与帝国秩序",kind:"era",discipline:"chemistry",track:"world",year:-450,yearEnd:565,place:"罗马",summary:"从《十二铜表法》到《查士丁尼法典》，把「规则可写、可查、可辩」变成治理技术。",detail:"罗马的贡献不在自然科学，而在制度化的理性：法律条文、证据、程序。后世的大学、学会章程与科学规范，都受益于这种「可操作的规则」传统。",era:{politics:"共和到帝国，行省治理",society:"公民权逐步扩大"},sections:[{title:"十二铜表法",meta:"前 450—565",body:"平民要求把法律写出来，贵族不能再凭记忆解释。法律第一次成了公开文本。"},{title:"从公民法到万民法",body:"帝国扩张后，需要处理不同民族之间的纠纷。万民法（jus gentium）逐渐发展出超越族群的规则。"},{title:"法学家的作用",body:"罗马法不是皇帝一人写成的，而是法学家不断解释、论辩、著述的结果。乌尔比安、盖尤斯的观点被写进法典。"},{title:"影响",body:"查士丁尼《民法大全》在中世纪被重新发现，成为欧洲大陆法系的源头。「法律是理性的命令」这个观念，从这里开始。"}],tags:["历史","制度","法律"]},{id:"era-hundred-schools",title:"百家争鸣",kind:"era",discipline:"physics",track:"cn",year:-500,yearEnd:-221,place:"中原",summary:"儒、墨、道、法、名、阴阳诸家并起，墨家尤其重逻辑、重技艺、重实测。",detail:"诸侯竞争催生「士」的流动与辩论。墨家后学讨论光学、力学与几何，名家研究概念与悖论——这是中国思想史上最接近「自然哲学」的时刻。",era:{politics:"春秋战国，诸侯争霸",society:"士阶层崛起，游说与著述成风",technology:"铁器、农耕与攻城器械"},sections:[{title:"为什么是这个时候",meta:"前 500—前 221",body:"诸侯竞争需要人才，士可以「朝秦暮楚」；旧的贵族垄断被打破，私学兴起，知识第一次可以流动。"},{title:"几大家的分歧",body:"儒家讲礼与仁，道家讲自然与无为，法家讲法术势，墨家讲兼爱与非攻。它们回答的是同一个问题：秩序从哪里来？"},{title:"墨家的科学兴趣",body:"墨家研究光学（小孔成像）、力学（杠杆）、几何与逻辑，还做过守城器械。这是中国古代最接近「自然哲学」的一支。"},{title:"争鸣的终结",body:"秦统一后焚书禁私学，汉初黄老、武帝独尊儒术。思想的多元竞争，被单一意识形态取代。"}],tags:["历史","思想"]},{id:"era-qin-unification",title:"秦统一与郡县制",kind:"era",discipline:"chemistry",track:"cn",year:-221,yearEnd:-206,place:"咸阳",summary:"书同文、车同轨、统一度量衡——标准化的治理，也是一种「可复制的技术」。",detail:"统一度量衡与文字，让跨地域的工程、税收与工艺记录成为可能。标准化的思路，后来一直是中国技术传统的底色。",era:{politics:"中央集权、郡县制",society:"编户齐民",technology:"驰道、兵器标准化"},sections:[{title:"为什么是秦",meta:"前 221",body:"秦据关中、行商鞅之法、奖励耕战，把国家变成一台高效的战争机器。六国各有短板，秦把长处做到了极致。"},{title:"制度创新",body:"郡县制、书同文、车同轨、统一度量衡与货币。这些不是装饰，而是让一个大国可以被「管理」的技术。"},{title:"焚书与速亡",body:"焚书禁私学压制了思想；严刑峻法与大规模徭役耗尽了民力。十五年后，帝国崩塌。"},{title:"汉承秦制",body:"汉朝批评秦的暴政，却几乎照搬了它的制度。制度的生命力，比对它的评价更长。"}],tags:["历史","制度","标准化"]},{id:"era-song-commerce",title:"宋代商业与城市",kind:"era",discipline:"physics",track:"cn",year:960,yearEnd:1279,place:"汴京、临安",summary:"坊市制瓦解、纸币出现、海外贸易兴盛，技术与知识的需求随之扩大。",detail:"印刷术普及让书籍变便宜，科举扩大让读书人变多。沈括、苏颂这类「官员兼学者」正是这个结构的产物。",era:{politics:"文官政治，边患与和议并存",society:"市民阶层与瓦舍勾栏",technology:"活字印刷、指南针、火药武器"},sections:[{title:"坊市制瓦解",meta:"960—1279",body:"唐代的城市被「坊」（居住）与「市」（交易）分开，夜间宵禁。宋代拆掉围墙，商铺沿街开设，夜市通宵。"},{title:"纸币与信用",body:"四川的交子是世界最早的纸币。它说明交易规模已经大到金属货币不够用。"},{title:"海外贸易",body:"泉州、广州、明州设市舶司，瓷器、丝绸、茶叶外销。海上丝绸之路的规模超过陆路。"},{title:"市民文化",body:"瓦舍勾栏、话本、戏曲。城市里出现了专门供人娱乐的场所，文化不再只属于士大夫。"}],tags:["历史","经济"]},{id:"era-reformation",title:"宗教改革",kind:"era",discipline:"physics",track:"world",year:1517,yearEnd:1648,place:"欧洲",summary:"权威从教会转向文本与个人判断，间接为「自己观察、自己论证」的科学态度松绑。",detail:"印刷术让《圣经》与论战小册子大量流通，解释权下移。科学革命与宗教改革共享同一个传播基础设施。",era:{politics:"诸侯与教廷的博弈，三十年战争",society:"识字率上升，教派冲突",technology:"印刷术"},sections:[{title:"1517 年的九十五条",meta:"1517—1648",body:"马丁·路德反对赎罪券，主张「因信称义」——救赎不需要教会中介。这句话拆掉了教会的垄断。"},{title:"印刷术的放大器",body:"路德的小册子被大量印刷、迅速传播。宗教改革是一场「媒介事件」，没有印刷术就不可能扩散得这么快。"},{title:"三十年战争",body:"教派冲突演变为全欧战争，人口损失惨重。《威斯特伐利亚和约》确立「主权国家」的原则。"},{title:"对科学的间接影响",body:"解释权从教会转向文本与个人判断，为「自己观察、自己论证」松了绑。但新教同样压制异端，对立并不简单。"}],tags:["历史","思想"]},{id:"era-enlightenment",title:"启蒙运动",kind:"era",discipline:"chemistry",track:"world",year:1685,yearEnd:1789,place:"法国、英国、德意志",summary:"理性、经验与公共讨论成为时髦，百科全书派把知识整理成可检索的体系。",detail:"《百科全书》把工匠技艺与自然哲学并列收录。拉瓦锡的定量化学、布丰的自然史，都在这种「公开、可检验」的氛围里成形。",era:{politics:"绝对王权与公共舆论的兴起",society:"沙龙、科学院、期刊"},sections:[{title:"理性的公共使用",meta:"1685—1789",body:"康德说启蒙就是「敢于运用自己的理性」。沙龙、期刊、咖啡馆成为公共讨论的场所。"},{title:"百科全书",body:"狄德罗与达朗贝尔主编的《百科全书》把工艺技术与自然哲学并列收录，知识被整理成可检索的体系。"},{title:"对制度的影响",body:"三权分立、社会契约、自然权利——这些观念直接进入美国宪法与法国人权宣言。"},{title:"局限",body:"启蒙的「普遍理性」常以欧洲为中心，也低估了情感、传统与地方性知识。后来的浪漫主义正是对它的反拨。"}],tags:["历史","思想","公共领域"]},{id:"era-yangwu",title:"洋务运动",kind:"era",discipline:"chemistry",track:"cn",year:1861,yearEnd:1895,place:"上海、福州、天津",summary:"「师夷长技」办厂、办学、办翻译馆，近代科学第一次以制度形式进入中国。",detail:"江南制造局翻译馆、福州船政学堂、京师同文馆——它们不只引进机器，更引进了教材、术语与教学方法。",era:{politics:"内忧外患下的自强运动",society:"新式学堂与留学生",technology:"造船、兵工、电报"},sections:[{title:"为什么是这时候",meta:"1861—1895",body:"两次鸦片战争败北，太平天国又起。一部分官员认为必须「师夷长技」——先学船炮，再谈其他。"},{title:"办了什么",body:"安庆内军械所、江南制造总局、福州船政局、轮船招商局；同时办新式学堂、派留学生、设翻译馆。"},{title:"官督商办",body:"企业由官方主导、商人出资，产权与经营权模糊。这种模式能快速起步，却难以持续创新——轮船招商局的困境是典型。"},{title:"为什么失败",body:"只学技术、不改制度，甲午一战暴露了问题。但它留下的学校、译书与人才，成了后来变法与革命的底子。"}],tags:["历史","制度"]},{id:"era-xinhai",title:"辛亥革命",kind:"era",discipline:"physics",track:"cn",year:1911,yearEnd:1912,place:"武昌、南京",summary:"帝制终结，新式教育与科学社团获得更大空间。",detail:"民国初年，大学、学会、期刊陆续建立，科学开始从「洋务工具」变成「独立事业」。",era:{politics:"共和取代帝制，军阀割据",society:"剪辫、易服、废科举后的新学制"},sections:[{title:"晚清的最后十年",meta:"1911",body:"庚子之后，清廷推行新政：废科举、练新军、办新学。这些改革培养了后来的革命者，也耗尽了财政与人心。"},{title:"武昌起义",body:"1911 年 10 月 10 日，新军中的革命党人在武昌起事，各省相继响应。不到两个月，十四个省宣布独立。"},{title:"帝制终结",body:"1912 年 1 月 1 日中华民国成立，2 月清帝退位。两千多年的帝制结束，共和第一次成为中国的政体。"},{title:"局限与余波",body:"革命没有触动土地制度，也没有建立稳定的中央政权。此后的军阀割据与反复的复辟，说明「制度改变」与「社会改变」并不是一回事。"}],tags:["历史","政治"]},{id:"era-may-fourth",title:"五四运动与新文化",kind:"era",discipline:"chemistry",track:"cn",year:1915,yearEnd:1921,place:"北京、上海",summary:"「赛先生」被请进公共讨论，科学从技术手段上升为一种思维方式。",detail:"《新青年》提倡白话文与科学方法，留学生带回实验传统。此后中国的科学事业开始有意识地建制化。",era:{politics:"反帝爱国运动，思想启蒙",society:"白话文、女子教育、社团"},sections:[{title:"新文化运动",meta:"1915—1921",body:"《新青年》提倡白话文、反对旧礼教，把「民主」与「科学」请进公共讨论。科学第一次被当作一种思维方式，而不只是技术。"},{title:"五四那一天",body:"1919 年 5 月 4 日，北京学生因巴黎和会外交失败上街游行。运动迅速扩展到全国，工人与商人加入。"},{title:"赛先生",body:"「赛先生」与「德先生」并列，成为口号。此后科学社团、期刊、大学院系陆续建立，科学开始建制化。"},{title:"后续",body:"1921 年中国共产党成立；留学生在海外学习现代科学；一批人回国建立实验室。中国现代科学的地基，是在这十年里铺下的。"}],tags:["历史","思想"]},{id:"cz-prehistory",title:"中华文明起源",kind:"era",discipline:"chemistry",track:"cn",year:-8e3,yearEnd:-2070,place:"黄河、长江流域",summary:"农业、聚落与陶器、玉器出现，多元一体的文明格局在史前已经成形。",detail:"稻作与粟作两条农业线，支撑了定居与手工业分工。制陶的温度控制、金属冶炼的还原反应，是最早的「化学实践」。",sections:[{title:"为什么说「多元一体」",body:"史前中国是多线并进的。辽河流域、黄河中上游、长江下游各自发展出不同的文化传统，彼此交流、竞争、融合，到龙山时代逐渐向中原汇聚。这就是「满天星斗」到「月明星稀」的过程。"},{title:"仰韶文化",meta:"约前 5000—前 3000 年 · 黄河中游",body:"以彩陶著称，半坡类型的人面鱼纹盆、庙底沟类型的花瓣纹是教科书上的常客。聚落有壕沟、有公共墓地，说明已经有了稳定的定居与初步的社会分层。"},{title:"良渚文化",meta:"约前 3300—前 2300 年 · 长江下游",body:"玉琮、玉璧、玉钺构成一套礼制符号；古城遗址有城墙、水坝和大型祭坛。良渚的水利系统比传说中的大禹治水还早，说明复杂社会组织早已出现。"},{title:"龙山文化",meta:"约前 3000—前 1900 年 · 黄河中下游",body:"黑陶（蛋壳陶）代表极高的窑温控制与轮制技术。城址大量出现，墓葬随葬品差距拉大，社会已经站在国家门坎上。"},{title:"与物理化学的关系",body:"制陶要控制窑温与气氛（氧化/还原），这是最早的「热工化学」；玉器加工涉及硬度认识与研磨技术；铜器冶炼则是最早的还原反应实践。"},{title:"三条支流",meta:"约前 5000—前 1900",body:"辽河的红山、黄河的仰韶与龙山、长江下游的良渚，各自发展出玉器、彩陶、城址与水利。它们不是同一条线的先后阶段，而是并行、竞争、逐渐汇聚的三条支流。"}],era:{technology:"制陶、稻作、玉器加工"},tags:["历史","先秦"]},{id:"cz-xia-shang",title:"夏商周与青铜礼制",kind:"era",discipline:"chemistry",track:"cn",year:-2070,yearEnd:-771,place:"中原",summary:"青铜铸造达到高峰，礼制与文字把技术知识固定在制度与文本里。",detail:"商周青铜器需要锡铅配比、范铸与合金控制，是最早的规模化冶金。甲骨文与金文则让记录可以跨代传递。",era:{politics:"王权与分封",technology:"青铜冶铸、历法"},sections:[{title:"夏朝存在吗",meta:"约前 2070—前 771",body:"文献里有夏，考古上有二里头。二里头有宫殿、青铜器与城市规划，但是否就是「夏」，学界仍在争论。"},{title:"商与甲骨文",body:"殷墟出土的甲骨文，是目前确认的最早成熟汉字系统。有了文字，历史才从传说变成可核对的记录。"},{title:"青铜与礼制",body:"商周青铜器需要锡铅配比、范铸与合金控制。器物的形制与数量对应等级，这就是「礼」。"},{title:"青铜之外",body:"同一时期还有玉器、漆器、原始瓷。技术体系比「青铜时代」这个词所暗示的更丰富。"}],tags:["历史","先秦","冶金"]},{id:"cz-spring-autumn",title:"春秋战国社会变革",kind:"era",discipline:"physics",track:"cn",year:-770,yearEnd:-221,place:"中原",summary:"铁犁牛耕普及、井田制瓦解、士阶层流动，社会结构剧变催生了百家争鸣。",detail:"生产力提升带来土地私有与战争规模扩大，各国变法求强。思想与技术的竞争，是这一时期最鲜明的特征。",era:{politics:"诸侯争霸、变法图强",technology:"铁器、牛耕、水利"},sections:[{title:"铁器与牛耕",meta:"前 770—前 221",body:"铁农具与牛耕让开垦荒地的成本大幅下降，一家一户的耕作成为可能。这是整个社会变动的技术前提。"},{title:"井田制瓦解",body:"土地从「公田」转向私有，各国相继「初税亩」「废井田」。税制变了，国家与农民的关系也变了。"},{title:"士的崛起",body:"战争规模扩大，需要懂兵法、外交、治理的人。士阶层游走于各国之间，靠知识与口才谋生。"},{title:"变法",body:"管仲、李悝、商鞅……各国用变法回应竞争。变法的核心是「把资源集中到国家手里」，为统一战争做准备。"}],tags:["历史","先秦"]},{id:"cz-han",title:"汉朝大一统与丝绸之路",kind:"era",discipline:"physics",track:"cn",year:-202,yearEnd:220,place:"长安、洛阳",summary:"郡国并行到推恩令，张骞通西域打开欧亚通道，天文、算学与医学都有系统著作。",detail:"《九章算术》《伤寒杂病论》与浑天仪，是这个时期知识体系化的代表。丝绸之路让技术与物产双向流动。",era:{politics:"中央集权与察举制",technology:"造纸、冶铁、天文仪器"},sections:[{title:"从郡国并行到推恩",meta:"前 202—220",body:"汉初分封同姓王，结果引发七国之乱。此后「推恩令」把诸侯国越分越小，中央集权才真正建立。"},{title:"丝绸之路",body:"张骞通西域，打开欧亚通道。丝绸、漆器西去，葡萄、苜蓿、良马东来，技术与作物随之流动。"},{title:"知识与技术",body:"《九章算术》成书、张衡造浑天仪与地动仪、蔡伦改进造纸。汉代的科学，是「国家工程」的产物。"},{title:"豪族问题",body:"土地兼并让豪族坐大，中央与地方的张力贯穿两汉。这个问题此后两千年反复出现。"}],tags:["历史","秦汉"]},{id:"cz-wei-jin",title:"三国两晋南北朝",kind:"era",discipline:"chemistry",track:"cn",year:220,yearEnd:589,place:"南北分裂",summary:"长期分裂与民族交融，佛教东传，知识与技术在动荡中扩散重组。",detail:"北方民族内迁带来新的工艺与作物，南方开发加速。祖冲之的圆周率、贾思勰的《齐民要术》都出自这个时期。",era:{politics:"政权更迭、门阀政治",society:"民族交融、佛教盛行"},sections:[{title:"长期分裂",meta:"220—589",body:"三国、两晋、南北朝，近四百年分裂。政权更迭频繁，人口大规模流动。"},{title:"民族交融",body:"北方民族内迁，北魏孝文帝改革推行汉化；南方开发加速，经济重心开始南移。"},{title:"佛教东传",body:"佛教在这一时期广泛传播，寺院经济、译经事业兴起。它也带来了印度的天文、医学与逻辑。"},{title:"乱世里的科学",body:"祖冲之算圆周率、贾思勰写《齐民要术》、郦道元注《水经》。动荡之中，知识仍在积累。"}],tags:["历史","魏晋"]},{id:"cz-sui-tang",title:"隋唐盛世与科举制",kind:"era",discipline:"chemistry",track:"cn",year:581,yearEnd:907,place:"长安",summary:"统一、科举、开放，长安成为世界性都会，技术与学术随交流大量输入输出。",detail:"雕版印刷、火药配方、炼丹术与医药学在唐代成熟。科举让「读书—做官」成为可复制的路径。",era:{politics:"三省六部、科举",society:"胡汉交融、国际都会",technology:"雕版印刷、火药"},sections:[{title:"科举",meta:"581—907",body:"隋创科举，唐完善。选官标准从「出身」转向「考试」，读书人第一次有了制度化的上升通道。"},{title:"大运河",body:"贯通南北的水运网络，把江南的粮食运到长安。它是帝国统一的经济基础，也是巨大的人力成本。"},{title:"开放的长安",body:"长安是国际都会：胡商、留学生、僧侣、乐工云集。技术、宗教、艺术在这里交汇。"},{title:"安史之乱",body:"755 年安禄山起兵，唐由盛转衰。藩镇割据、宦官专权、财政崩溃，此后的朝代都在解决这些问题。"}],tags:["历史","隋唐"]},{id:"cz-song-yuan",title:"宋元经济与科技",kind:"era",discipline:"physics",track:"cn",year:960,yearEnd:1368,place:"开封、临安、大都",summary:"商品经济繁荣，活字印刷、指南针、火药武器走向成熟，科技达到古代高峰。",detail:"沈括《梦溪笔谈》、苏颂水运仪象台、郭守敬《授时历》，都是这个时期的产物。",era:{politics:"文官政治、行省制",technology:"活字印刷、指南针、火药"},sections:[{title:"经济的转折",meta:"960—1368",body:"宋代商品经济高度发达，城市人口激增，纸币「交子」出现。这在中国历史上是结构性的变化。"},{title:"技术的爆发",body:"活字印刷、指南针、火药武器走向成熟。这三项后来都传到了欧洲。"},{title:"理学",body:"程朱理学把儒家伦理形而上化，成为此后七百年的官方意识形态。它既提供了秩序，也压制了异端。"},{title:"元朝",body:"行省制、四等人制、欧亚交通。蒙古帝国的扩张让东西方交流达到前所未有的规模。"}],tags:["历史","宋元"]},{id:"cz-ming-qing",title:"明清君主专制与海禁",kind:"era",discipline:"chemistry",track:"cn",year:1368,yearEnd:1840,place:"北京",summary:"皇权空前强化，海禁与闭关使中西交流受限，但手工业与实学仍在积累。",detail:"《天工开物》《本草纲目》是对传统技术的总结；同期欧洲已进入近代科学，差距在此拉开。",era:{politics:"废丞相、设军机处",technology:"冶铁、纺织、陶瓷"},sections:[{title:"皇权空前强化",meta:"1368—1840",body:"明太祖废丞相，清设军机处。决策权集中到皇帝一人，官僚变成执行工具。"},{title:"海禁与闭关",body:"明朝海禁、清朝广州一口通商。官方限制贸易，民间走私却从未停止。"},{title:"白银与全球化",body:"美洲白银经菲律宾流入中国，成为主要货币。中国经济已经接入了全球贸易网络。"},{title:"实学与考据",body:"明清之际，顾炎武、黄宗羲等人提倡经世致用；乾嘉学派转向考据。技术在积累，理论却停滞。"}],tags:["历史","明清"]},{id:"cz-opium-war",title:"鸦片战争",kind:"history",discipline:"chemistry",track:"cn",year:1840,place:"广东、长江口",summary:"国门被打开，中国被迫卷入世界体系，也开始了向西方学习的漫长过程。",detail:"《南京条约》之后，通商口岸、传教士与新式学堂带来了科学与技术的输入渠道。",era:{politics:"不平等条约体系",society:"西学东渐的开端"},sections:[{title:"贸易失衡",meta:"1840",body:"中国出口茶叶、丝绸，进口却很少，白银大量流入。英国商人为扭转逆差，向中国走私鸦片。"},{title:"禁烟与开战",body:"1839 年林则徐虎门销烟。次年英国以「保护贸易」为名出兵，清军战败，签订《南京条约》。"},{title:"条约打开了什么",body:"割地、赔款、五口通商、协定关税。此后的不平等条约体系，把中国一步步拖进半殖民地状态。"},{title:"对知识的影响",body:"战败迫使一部分人「开眼看世界」：魏源编《海国图志》，洋务派办厂、译书、派留学生。西学东渐从这时候真正开始。"}],tags:["历史","近代"]},{id:"cz-jiawu",title:"甲午战争",kind:"history",discipline:"physics",track:"cn",year:1894,place:"黄海、辽东",summary:"败于明治维新后的日本，「师夷长技」的器物路线破产，转向制度与思想变革。",detail:"这场失败直接引出戊戌变法与后来的革命思潮，科学教育也被视为救亡的一部分。",sections:[{title:"一场被计算的战争",meta:"1894",body:"日本以「朝鲜问题」为借口开战。北洋水师装备不差，却败在制度、训练与指挥上。"},{title:"《马关条约》",body:"割台湾、赔两亿两白银、开放更多口岸。赔款相当于日本数年财政收入，也掏空了中国。"},{title:"洋务的破产",body:"「师夷长技」三十年，一仗打回原形。器物层面的学习，无法弥补制度与组织的差距。"},{title:"民族觉醒",body:"公车上书、强学会、维新思潮。甲午之后，救亡从「办洋务」转向「改制度」。"}],tags:["历史","近代"]},{id:"cz-wuxu",title:"戊戌变法",kind:"history",discipline:"chemistry",track:"cn",year:1898,place:"北京",summary:"百日维新试图从制度上改造教育、军事与官制，虽失败但启蒙影响深远。",detail:"废八股、办新学堂、译西书的主张，为后来的新学制准备了舆论。",sections:[{title:"百日维新",meta:"1898",body:"光绪帝在 103 天内发布上百道改革诏令：废八股、办新学堂、练新军、裁冗官。"},{title:"为什么失败",body:"没有实权的皇帝、被触动的既得利益、缺乏地方支持。慈禧发动政变，变法戛然而止。"},{title:"代价",body:"谭嗣同等「戊戌六君子」被杀，康有为、梁启超流亡。改革派的鲜血让更多人转向革命。"},{title:"启蒙的遗产",body:"新学堂、报刊、学会保留了下来。思想的种子没有随变法一起被废除。"}],tags:["历史","近代"]},{id:"cz-guomindang",title:"国民革命",kind:"era",discipline:"physics",track:"cn",year:1924,yearEnd:1927,place:"广州、武汉",summary:"国共合作、北伐推进，新式教育与科学社团在城市中获得发展空间。",detail:"大学院系与研究所陆续建立，现代科学开始有建制化的载体。",sections:[{title:"国共合作",meta:"1924—1927",body:"国民党一大确立联俄、联共、扶助农工。共产党员以个人身份加入国民党，共同办军校、发动工农。"},{title:"北伐",body:"1926 年出师，半年内打到长江流域。军阀势力被迅速击溃，但胜利也加剧了内部矛盾。"},{title:"清党与分裂",body:"1927 年四一二政变，国共合作破裂。大革命失败，共产党转向农村武装斗争。"},{title:"教训",body:"没有自己的军队与根据地，合作随时可能被单方面终止。这个教训塑造了此后二十年的路线。"}],tags:["历史","民国"]},{id:"cz-anti-japanese",title:"抗日战争",kind:"era",discipline:"physics",track:"cn",year:1931,yearEnd:1945,place:"全国",summary:"十四年抗战，高校内迁、科研机构西迁，学术在极端条件下延续。",detail:"西南联大在昆明坚持教学与研究，是这一时期知识共同体韧性的象征。",era:{politics:"民族战争、统一战线",society:"高校内迁、文化西迁"},sections:[{title:"十四年",meta:"1931—1945",body:"从九一八到日本投降，中国在极端困难的条件下坚持了十四年。这是一场全民族的战争，也是学术共同体的迁徙史。"},{title:"高校内迁",body:"平津、京沪的高校辗转迁往昆明、重庆、成都。图书仪器一路丢失，师生徒步数千里，课在庙宇与茅屋里照常开。"},{title:"西南联大",body:"北大、清华、南开合并为西南联大，在昆明办学八年。条件极差，却走出了杨振宁、李政道、邓稼先这一代人。"},{title:"留下的东西",body:"不只是人才，还有一种「学术可以被打断、但不能被取消」的信念。战后中国的科研体系，很多骨干都来自这段迁徙。"}],tags:["历史","民国"]},{id:"cz-liberation",title:"解放战争",kind:"era",discipline:"physics",track:"cn",year:1946,yearEnd:1949,place:"全国",summary:"三年内战结束，中华人民共和国成立，科学事业进入国家规划阶段。",detail:"中国科学院成立、院系调整，科研体系按国家需求重组。",sections:[{title:"重庆谈判",meta:"1946—1949",body:"抗战胜利后，国共在重庆谈判，签订双十协定，但内战很快爆发。"},{title:"三大战役",body:"辽沈、淮海、平津，共歼灭国民党军 150 余万。军事胜负背后是土地改革动员出的民心。"},{title:"渡江与建国",body:"1949 年 4 月渡江，南京解放；10 月 1 日，中华人民共和国成立。"},{title:"遗留问题",body:"台湾问题、经济重建、国际承认。新政权的第一步，是在废墟上恢复秩序。"}],tags:["历史","民国"]},{id:"cz-prc",title:"新中国成立",kind:"history",discipline:"physics",track:"cn",year:1949,place:"北京",summary:"国家统一与工业化起步，科学被纳入国家计划，「两弹一星」在此背景下展开。",detail:"1956 年制定十二年科技规划，核、航天、计算机等领域集中力量攻关。",sections:[{title:"建国",meta:"1949",body:"土地改革、镇压反革命、抗美援朝。新政权用三年时间稳住局面。"},{title:"工业化",body:"一五计划、156 项重点工程。重工业优先，为后来的国防与制造业打下基础。"},{title:"两弹一星",body:"在技术封锁与困难时期完成核试验与卫星发射。这是国家动员能力的集中体现。"},{title:"曲折",body:"大跃进、人民公社、文化大革命。代价沉重，也为后来的改革提供了反面经验。"}],tags:["历史","现代"]},{id:"cz-reform",title:"改革开放",kind:"history",discipline:"chemistry",track:"cn",year:1978,place:"北京",summary:"国门重开，留学、引进与自主创新并行，中国科学重新接入世界网络。",detail:"此后四十年，中国在材料、生命科学、信息等领域快速追赶，科研评价体系也逐步与国际接轨。",sections:[{title:"1978 年的转折",meta:"1978",body:"十一届三中全会把工作重心转向经济建设。安徽小岗村的包干到户，成为农村改革的起点。"},{title:"开放",body:"经济特区、沿海开放城市、加入 WTO。外资、技术、管理经验一起进来。"},{title:"成就与代价",body:"数亿人脱贫，制造业崛起；同时出现污染、区域差距与债务问题。"},{title:"科学的重建",body:"高考恢复、科学院恢复、留学开放。中国科学重新接入国际网络。"}],tags:["历史","现代"]},{id:"w-mesopotamia",title:"两河与古埃及文明",kind:"era",discipline:"chemistry",track:"world",year:-3500,yearEnd:-500,place:"两河流域、尼罗河",summary:"灌溉农业、楔形文字与金字塔，最早的测量、历法与金属工艺在这里成熟。",detail:"尼罗河的泛滥周期催生历法，建筑工程催生几何与力学经验，冶金与玻璃制造积累了物质变化的知识。",era:{politics:"城邦与神权王权",technology:"灌溉、青铜、建筑"},sections:[{title:"两河与灌溉",meta:"约前 3500—前 500",body:"底格里斯河与幼发拉底河定期泛滥，需要组织人力修渠排水。灌溉工程催生了城市、税收与王权。"},{title:"楔形文字",body:"用芦苇杆在泥板上压出符号，写下账目、契约、法律与史诗。文字最初不是为了文学，而是为了记账。"},{title:"法典与数学",body:"《汉谟拉比法典》把判例写成条文；六十进制、平方根表、二次方程解法都出现在泥板上。"},{title:"埃及的另一条线",body:"尼罗河的涨落催生历法；金字塔的建造需要几何与人力组织。两地共同构成「近东文明」的底色。"}],tags:["历史","上古"]},{id:"w-india",title:"古印度文明",kind:"era",discipline:"chemistry",track:"world",year:-1500,yearEnd:-500,place:"印度河流域、恒河流域",summary:"种姓制度与宗教哲学成形，「零」与十进制在此后印度数学中发展。",detail:"《吠陀》与后来佛教的因明学，发展出严密的推理传统，对逻辑与认识论有独立贡献。",era:{politics:"种姓制度、列国时代",society:"宗教哲学繁荣"},sections:[{title:"印度河的城市",meta:"约前 1500—前 500",body:"摩亨佐-达罗有格网街道、下水道与标准化砖块。这种城市规划的整齐程度，在古代世界罕见。"},{title:"吠陀与种姓",body:"雅利安人带来吠陀文献与祭祀传统，种姓制度把社会分为婆罗门、刹帝利、吠舍、首陀罗。秩序被写进宗教。"},{title:"佛教与因明",body:"佛教反对种姓，发展出严密的因明学（逻辑与认识论）。这是印度对世界思想最独特的贡献之一。"},{title:"数字与零",body:"印度发展出十进位值制与「零」的概念，经阿拉伯传入欧洲。今天所谓的「阿拉伯数字」，源头在印度。"}],tags:["历史","上古"]},{id:"w-medieval",title:"中古西欧封建社会",kind:"era",discipline:"chemistry",track:"world",year:476,yearEnd:1450,place:"西欧",summary:"封君封臣、庄园与教会构成秩序，大学兴起让知识生产重新组织化。",detail:"11 世纪起，博洛尼亚、巴黎、牛津等大学出现，经院哲学用逻辑重读古典，为近代科学准备了方法训练。",era:{politics:"封建等级、教权与王权",society:"庄园经济、大学兴起"},sections:[{title:"封建与庄园",meta:"476—1450",body:"封君封臣、庄园经济、农奴制。权力分散在各级领主手中，国王只是「同级中的第一人」。"},{title:"教会的地位",body:"教会掌握土地、教育、婚姻与救济。它既是精神权威，也是最大的行政组织。"},{title:"大学的兴起",body:"博洛尼亚、巴黎、牛津相继成立。大学有自治权、课程与学位，经院哲学用逻辑重读古典。"},{title:"黑死病",body:"1347—1351 年，欧洲人口减少三分之一。劳动力短缺冲击庄园制，也为后来的社会变动埋下伏笔。"}],tags:["历史","中古"]},{id:"w-arab",title:"阿拉伯帝国",kind:"era",discipline:"chemistry",track:"world",year:632,yearEnd:1258,place:"西亚、北非、伊比利亚",summary:"翻译运动保存并发展了希腊学术，代数、炼金术与光学在这里推进。",detail:"花拉子米的代数、海什木的光学、贾比尔派的炼金实践，后来经西班牙传入欧洲。",era:{politics:"哈里发国家",society:"多民族、多宗教",technology:"造纸、炼金"},sections:[{title:"翻译运动",meta:"632—1258",body:"巴格达的「智慧宫」系统翻译希腊、波斯、印度的著作。许多古典文本，欧洲后来是从阿拉伯文转译回去的。"},{title:"代数与光学",body:"花拉子米把方程解法系统化；海什木用实验与几何研究视觉，提出光是入眼而非出眼。"},{title:"炼金术",body:"贾比尔派发展出蒸馏、结晶、煅烧等操作，虽然目标还是「点石成金」，但积累了大量实验技术。"},{title:"衰落与遗产",body:"蒙古攻陷巴格达后，学术中心转移。阿拉伯的代数、光学与医学，经西班牙传入欧洲大学。"}],tags:["历史","中古","传播"]},{id:"w-ottoman",title:"奥斯曼帝国",kind:"era",discipline:"physics",track:"world",year:1299,yearEnd:1922,place:"小亚细亚、巴尔干",summary:"控制东西方商路，1453 年攻陷君士坦丁堡，间接推动欧洲寻找新航路。",detail:"商路成本上升与地中海格局变化，是地理大发现的经济动因之一。",era:{politics:"苏丹集权、米勒特制"},sections:[{title:"从边境小邦到帝国",meta:"1299—1922",body:"奥斯曼起于安纳托利亚边境，靠军事与联姻扩张，1453 年攻陷君士坦丁堡，灭拜占庭。"},{title:"苏莱曼时代",body:"16 世纪，帝国横跨欧亚非，控制东西方商路。法律、税收、建筑都达到高峰。"},{title:"商路与地理大发现",body:"奥斯曼控制传统商路后，欧洲的东方贸易成本上升，寻找新航路的动力增加。"},{title:"衰落与「东方问题」",body:"19 世纪，帝国被欧洲列强称为「欧洲病夫」。它的解体，是一战与中东格局的直接前史。"}],tags:["历史","中古"]},{id:"w-discovery",title:"新航路开辟",kind:"history",discipline:"physics",track:"world",year:1492,place:"大西洋、印度洋",summary:"哥伦布、达伽马、麦哲伦把世界连成一体，也带来了殖民与物种大交换。",detail:"远洋航行依赖罗盘、星盘与更精确的天文表，航海需求反过来推动天文观测与制图。",era:{politics:"殖民扩张、重商主义",technology:"罗盘、星盘、造船"},sections:[{title:"为什么出海",meta:"1492",body:"奥斯曼控制商路、香料价格高涨；宗教热情与王室竞争叠加；罗盘、星盘、卡拉维尔帆船提供了技术条件。"},{title:"三条航线",body:"哥伦布向西到美洲，达伽马绕好望角到印度，麦哲伦船队完成环球。世界第一次被连成一张网。"},{title:"哥伦布大交换",body:"玉米、马铃薯、烟草传到旧大陆；小麦、马、天花带到美洲。物种、疾病、人口都发生了不可逆的重组。"},{title:"代价",body:"美洲原住民人口锐减，非洲被卷入奴隶贸易。全球化的第一页，是用暴力写成的。"}],tags:["历史","近代","全球史"]},{id:"w-england-rev",title:"英国资产阶级革命",kind:"era",discipline:"physics",track:"world",year:1640,yearEnd:1688,place:"英格兰",summary:"从内战到光荣革命，君主立宪确立，皇家学会与实验科学同步兴起。",detail:"1660 年皇家学会成立，实验演示与期刊通信成为知识生产的标准流程，牛顿的时代由此开始。",era:{politics:"议会主权、君主立宪",society:"公共领域与学会"},sections:[{title:"内战与克伦威尔",meta:"1640—1688",body:"议会与国王争夺征税权与军权，爆发内战。查理一世被处死，共和实验失败，王朝复辟。"},{title:"光荣革命",body:"1688 年议会邀请威廉与玛丽入主，国王权力被《权利法案》限制。过程几乎没有流血，故称「光荣」。"},{title:"君主立宪",body:"国王统而不治，实权在议会与内阁。这套制度为后来的工业化提供了稳定的产权与法律环境。"},{title:"皇家学会",body:"1660 年成立，实验演示与期刊通信成为标准。牛顿、胡克、波义耳都在这个网络里工作。"}],tags:["历史","近代"]},{id:"w-us-rev",title:"美国独立战争",kind:"era",discipline:"chemistry",track:"world",year:1775,yearEnd:1783,place:"北美",summary:"独立宣言与联邦宪法，把启蒙的政治理念第一次写进国家制度。",detail:"「人人生而平等」的表述与科学革命的自然权利观同源，制度实验与科学实验在同一世纪发生。",sections:[{title:"独立宣言",meta:"1775—1783",body:"「人人生而平等」写进宣言。它把启蒙的自然权利观变成了政治行动。"},{title:"宪法与联邦制",body:"1787 年宪法设计了三权分立与联邦—州分权。这是第一次用成文宪法约束国家权力。"},{title:"未解决的矛盾",body:"奴隶制被回避，原住民被排除在外。「平等」在很长时间里只属于有产白人男性。"},{title:"对欧洲的示范",body:"法国革命者直接引用美国经验。一个殖民地可以建立共和国，这件事本身就动摇了旧欧洲。"}],tags:["历史","近代"]},{id:"w-french-rev",title:"法国大革命",kind:"era",discipline:"chemistry",track:"world",year:1789,yearEnd:1799,place:"法国",summary:"旧制度崩塌，度量衡统一与公民教育重建，科学被赋予公共使命。",detail:"米制在革命中被确立，拉瓦锡的《化学基本论述》也在 1789 年出版——制度与知识同时重构。",era:{politics:"共和、恐怖统治、拿破仑",society:"公民平等、世俗教育"},sections:[{title:"三级会议",meta:"1789—1799",body:"财政危机迫使路易十六召开三级会议。第三等级自行组成国民议会，革命由此开始。"},{title:"人权宣言",body:"「自由、财产、安全与反抗压迫」被写成条文。封建特权被废除，公民平等成为原则。"},{title:"恐怖统治",body:"外敌入侵、内部分裂、派系斗争，革命走向极端。罗伯斯庇尔倒台后，恐怖结束，但动荡继续。"},{title:"拿破仑与遗产",body:"拿破仑把革命的成果写进《民法典》并随军队传播。革命的口号传遍欧洲，也带来了民族主义与战争。"}],tags:["历史","近代"]},{id:"w-marx",title:"马克思主义诞生",kind:"history",discipline:"chemistry",track:"world",year:1848,place:"伦敦、布鲁塞尔",summary:"《共产党宣言》发表，社会科学获得一套新的分析框架，深刻影响 20 世纪。",detail:"它与同一时期的能量守恒、细胞学说、进化论并列为 19 世纪的思想地标。",sections:[{title:"1848 年的小册子",meta:"1848",body:"《共产党宣言》用「至今一切社会的历史都是阶级斗争的历史」开篇。它把社会变迁的动力放在经济结构上。"},{title:"《资本论》",body:"马克思用剩余价值解释利润来源，分析资本主义的内在矛盾。这是一套宏大的社会理论，不是实验科学。"},{title:"影响",body:"20 世纪的政治版图被它改写。它也深刻影响了历史学、社会学与经济学的问题意识。"},{title:"争议",body:"预言与现实的偏差、计划经济的实践问题，一直是争论焦点。把它当作分析工具而非教条，是较常见的态度。"}],tags:["历史","近代","思想"]},{id:"w-ww1",title:"第一次世界大战",kind:"era",discipline:"physics",track:"world",year:1914,yearEnd:1918,place:"欧洲",summary:"工业化战争展示了化学与物理的破坏力，也加速了航空、无线电与医学的发展。",detail:"毒气、炸药、飞机与 X 射线诊断都在战争中大规模应用，科学家的社会责任从此成为议题。",sections:[{title:"导火索与结构",meta:"1914—1918",body:"萨拉热窝的枪声是导火索，真正的原因是同盟体系、军备竞赛与殖民争夺。一颗子弹引爆了整个欧洲。"},{title:"堑壕战",body:"机枪、铁丝网、重炮让进攻变成屠杀。凡尔登一役双方伤亡数十万，战线只移动了几公里。"},{title:"科学的动员",body:"毒气、飞机、潜艇、X 射线诊断。科学家第一次大规模参与战争，也第一次面对伦理追问。"},{title:"凡尔赛体系",body:"苛刻的赔款与领土安排埋下复仇的种子。二十年后，同一片土地再次开战。"}],tags:["历史","现代"]},{id:"w-oct-rev",title:"俄国十月革命",kind:"history",discipline:"physics",track:"world",year:1917,place:"彼得格勒",summary:"第一个社会主义国家诞生，20 世纪的政治与科学组织方式都被改写。",detail:"计划经济下的科研体制（如苏联的物理研究所）后来成为多国效仿的模板。",sections:[{title:"从二月到十月",meta:"1917",body:"二月革命推翻沙皇，出现临时政府与苏维埃并存的局面。十月，布尔什维克夺取政权。"},{title:"苏维埃政权",body:"土地法令、退出战争、建立工农政权。随后是三年内战与外国干涉。"},{title:"计划经济",body:"苏联用五年计划集中资源搞工业化，成绩与代价都极大。这套模式后来被多国仿效。"},{title:"对中国的影響",body:"「十月革命一声炮响」——马克思主义从理论变成可操作的路径，直接影响了五四后的中国。"}],tags:["历史","现代"]},{id:"w-ww2",title:"第二次世界大战",kind:"era",discipline:"physics",track:"world",year:1939,yearEnd:1945,place:"全球",summary:"雷达、喷气机、计算机与原子弹在战争中诞生，「大科学」时代到来。",detail:"曼哈顿计划证明：科学、工程与国家动员可以耦合到前所未有的规模。",sections:[{title:"扩张与绥靖",meta:"1939—1945",body:"日本侵华、德国扩张、意大利冒险。英法的绥靖政策换来的不是和平，而是更大的战争。"},{title:"总体战",body:"全民动员、战略轰炸、工业产能对决。战争胜负越来越取决于工厂与资源，而不只是战场。"},{title:"科学与武器",body:"雷达、喷气机、计算机、原子弹。曼哈顿计划证明：国家可以组织起前所未有的科研规模。"},{title:"战后秩序",body:"联合国、布雷顿森林体系、冷战格局。二战的结果，直接定义了此后五十年的国际格局。"}],tags:["历史","现代"]},{id:"w-cold-end",title:"苏联解体与两极终结",kind:"history",discipline:"physics",track:"world",year:1991,place:"莫斯科",summary:"冷战格局结束，全球化与信息革命加速，科学合作网络重新编织。",detail:"互联网从军事项目转向民用，科研协作的规模与速度再次跃升。",sections:[{title:"东欧剧变",meta:"1991",body:"1989 年东欧各国政权相继更替，柏林墙倒塌。苏联选择不干预，这是与 1956、1968 年最大的不同。"},{title:"苏联解体",body:"经济停滞、民族问题、改革失控。1991 年 12 月，苏联正式解体。"},{title:"单极时刻",body:"美国成为唯一超级大国，全球化加速。福山提出「历史终结论」——很快被现实反驳。"},{title:"未终结的冷战",body:"北约东扩、俄罗斯反弹、地区冲突。冷战的结构消失了，但它留下的问题仍在。"}],tags:["历史","现代"]}],M0=[{id:"w-ptolemy",title:"托勒密地心说",kind:"theory",discipline:"physics",track:"world",year:150,place:"亚历山大里亚",summary:"用本轮均轮解释行星运动，统治天文学一千四百年。",detail:"它是一套能相当准确预测行星位置的计算模型——科学史上最成功的错误理论之一。",sections:[{title:"为什么需要本轮和均轮",meta:"约 150",body:"行星在星空里会「逆行」——走一段又倒退。地心说若只用正圆，解释不了这种折返；托勒密在本轮上再套均轮，让圆滚圆，才拟合出观测到的轨迹。"},{title:"这套模型能算什么",body:"它能相当准确地预测行星位置、预报日食月食，还能用于航海定位。作为计算工具，它在中世纪是无可替代的。"},{title:"为什么能统治一千四百年",body:"因为它「够用」：能算历法、定节气、指导航海。更关键的是它被制度吸收了——13 世纪托马斯·阿奎那把亚里士多德—托勒密体系整合进经院哲学，大学的天文课以它为教材，但丁《神曲》里的宇宙结构也是托勒密式的。一套理论一旦变成课程与常识，就很难被推翻。"},{title:"宗教因素的两个阶段",body:"中世纪教会并没有「一开始就反对」地心说，反而把它吸收成自己的宇宙图景。真正的冲突发生在 17 世纪：1616 年《天体运行论》被列入禁书目录，1633 年伽利略受审——那时距哥白尼出版已过去七十多年。与其说宗教与科学天生对立，不如说是反宗教改革时期的政治与权威之争。"},{title:"它错在哪",body:"错在把「计算方便」当成了「真实结构」。日心说真正赢的地方，是模型更简单、预言更准——而简洁本身就是一种证据。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["天文学","模型"]},{id:"w-copernicus",title:"哥白尼日心说",kind:"theory",discipline:"physics",track:"world",year:1543,place:"弗龙堡",summary:"把太阳放到中心，用更简洁的模型解释行星的逆行。",detail:"《天体运行论》出版于他去世那年。日心说真正的优势是「简单」——奥卡姆剃刀第一次在天文学上起了作用。",sections:[{title:"旧体系的繁琐",meta:"1543",body:"到了 16 世纪，地心模型的圆越加越多，计算越来越繁，预测却仍不够准。哥白尼觉得，这样的体系不像「上帝的作品」。"},{title:"日心说的简洁",body:"把太阳放到中心，行星逆行就变成视角效应，不需要额外的圆。模型更简单，预言也更准。"},{title:"出版与接受",body:"《天体运行论》出版于他去世那年。书没有被立刻禁止，反而被当作计算工具使用——直到伽利略把它当作事实宣讲。"},{title:"他仍保留了圆",body:"哥白尼坚持行星走正圆，所以仍需小本轮。真正的椭圆要等开普勒。他的革命不彻底，却是关键一步。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["天文学","范式"]},{id:"w-tycho",title:"第谷的精密观测",kind:"experiment",discipline:"physics",track:"world",year:1580,place:"汶岛",summary:"二十年肉眼观测，把行星位置精度提高到角分级，为开普勒准备数据。",detail:"在没有望远镜的年代，靠大型象限仪与严谨记录做到这一步，说明「仪器 + 纪律」本身就是一种科学能力。",sections:[{title:"一座岛上的天文台",meta:"1576",body:"丹麦国王把汶岛赐给第谷，他在那里建了 Uraniborg——欧洲当时最精密的天文台。"},{title:"肉眼能达到的极限",body:"没有望远镜，他靠大型象限仪与严谨的记录规程，把行星位置精度提到约 1 角分，比前人高一个数量级。"},{title:"他不接受日心说",body:"第谷提出折中模型：行星绕太阳，太阳绕地球。他不相信地球会动，但他的数据最终支持了日心说。"},{title:"数据留给谁",body:"他晚年雇了开普勒。第谷死后，开普勒拿到那批观测数据，才有了椭圆轨道。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["观测","数据"]},{id:"w-hooke",title:"胡克定律",kind:"law",discipline:"physics",track:"world",year:1676,place:"伦敦",summary:"弹性限度内，形变与外力成正比——力学第一次有了「材料」的维度。",detail:"胡克还提出过引力与距离平方反比的猜想，与牛顿的优先权之争是科学史上著名公案。",sections:[{title:"弹性与形变",meta:"1676",body:"胡克发现：在弹性限度内，弹簧的伸长与所受的力成正比。这条关系简单到像常识，却是材料力学的起点。"},{title:"显微镜下的世界",body:"他自制显微镜，观察跳蚤、软木薄片，画下《显微图谱》。「细胞」（cell）这个词就是他起的。"},{title:"与牛顿的争论",body:"胡克主张引力与距离平方成反比，与牛顿争夺优先权。两人互相敌视，胡克的肖像甚至在牛顿任会长期间失踪。"},{title:"定律的边界",body:"胡克定律只在弹性限度内成立。超过限度，材料会发生塑性形变，撤去力也回不去。"}],textbooks:[{stage:"junior",module:"物理八年级下册",chapter:"弹力"},{stage:"senior",module:"物理必修第一册",chapter:"第三章 相互作用——力"}],tags:["弹力","材料"]},{id:"w-huygens",title:"惠更斯原理",kind:"theory",discipline:"physics",track:"world",year:1678,place:"海牙",summary:"把波前上每一点当作新的子波源，解释了反射、折射与衍射。",detail:"惠更斯用波动说与牛顿的微粒说对抗了一个多世纪，直到光的干涉实验才分出胜负。",sections:[{title:"摆钟",meta:"1656",body:"伽利略发现摆的等时性，惠更斯把它做成钟。摆钟把计时精度从「分钟级」推到「秒级」，航海与天文都受益。"},{title:"土星环与土卫六",body:"他用自制的望远镜发现土卫六，并正确解释土星「耳朵」是环。这是观测与几何推理的结合。"},{title:"惠更斯原理",body:"波前上每一点都是新的子波源，子波的包络就是新的波前。用它解释反射、折射、衍射都很自然。"},{title:"与牛顿的分歧",body:"他支持波动说，反对微粒说。这场争论持续一个多世纪，直到光的干涉实验给出判决——但那时两人都已不在。"}],textbooks:[{stage:"senior",module:"物理选择性必修第一册",chapter:"第三章 机械波"}],tags:["波动","光学"]},{id:"w-cavendish",title:"卡文迪许扭秤实验",kind:"experiment",discipline:"physics",track:"world",year:1798,place:"伦敦",summary:"用扭秤测出万有引力常量，第一次「称量」了地球的质量。",detail:"装置极其灵敏，需在密闭房间里读数。它把万有引力从定律变成了可测的常数。",sections:[{title:"要测的是什么",meta:"1798",body:"牛顿的万有引力定律里有个未知常数 G。测出 G，就能用地球表面的重力加速度反推地球质量——所以这个实验被称作「称量地球」。"},{title:"装置怎么工作",body:"一根细石英丝悬着横杆，两端各挂一个小铅球；再放两个大铅球靠近，微弱的引力让横杆轻微扭转。石英丝的扭转角度由光杠杆放大读出。"},{title:"难在哪里",body:"引力极小，任何气流、振动、温度变化都会干扰。卡文迪许把装置放进密闭房间，在室外用望远镜读数。"},{title:"为什么重要",body:"它把万有引力从「定律」变成了「可测的常数」，也让人类第一次知道地球有多重。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["引力","精密测量"]},{id:"w-coulomb",title:"库仑定律",kind:"law",discipline:"physics",track:"world",year:1785,place:"巴黎",summary:"电荷间的作用力与电量乘积成正比、与距离平方成反比。",detail:"库仑用扭秤测微小力，形式与万有引力惊人相似——这种「同构」让后来的场论有了起点。",sections:[{title:"怎么测微小的力",meta:"1785",body:"库仑用扭秤：带电小球之间的斥力让悬丝扭转，扭转角反映力的大小。这套装置与卡文迪许的扭秤同源。"},{title:"平方反比的结论",body:"电荷间的作用力与电量乘积成正比，与距离平方成反比。形式与万有引力完全一致。"},{title:"这种「同构」意味着什么",body:"两种完全不同的现象遵守同一数学形式，强烈暗示背后有统一的场结构。法拉第与麦克斯韦后来把这条线索接了下去。"},{title:"适用边界",body:"库仑定律只适用于静止的点电荷。电荷运动时会产生磁场，作用力要用洛伦兹力描述。"}],textbooks:[{stage:"senior",module:"物理必修第三册",chapter:"第九章 静电场及其应用"}],tags:["静电","平方反比"]},{id:"w-volta",title:"伏打电堆",kind:"invention",discipline:"physics",track:"world",year:1800,place:"帕维亚",summary:"第一块能持续供电的电池，让「稳定电流」成为可研究的对象。",detail:"在伏打之前，电只是静电火花；有了电堆，奥斯特、法拉第才可能研究电流的磁与化学效应。",sections:[{title:"青蛙腿之争",meta:"1800",body:"伽伐尼发现解剖后的蛙腿在两种金属接触时会抽搐，认为那是「动物电」。伏打不同意：电来自金属，蛙腿只是检流计。"},{title:"用舌头和眼睛验证",body:"伏打把两种金属夹在舌头上，尝到酸味；用它们接触眼睛，看到闪光。他因此判断电流来自金属接触，而不是生物组织。"},{title:"电堆的结构",body:"把铜片、锌片夹上浸过盐水的布片，一层层叠起来。两端就产生了持续的电压——第一块能稳定供电的电池。"},{title:"为什么它是分水岭",body:"静电只能产生瞬间火花，电堆给的是持续电流。此后二十年的电磁学发现，几乎都以它为工具。"}],textbooks:[{stage:"senior",module:"物理必修第三册",chapter:"第十一章 电路及其应用"}],tags:["电源","电化学"]},{id:"w-oersted",title:"电流的磁效应",kind:"experiment",discipline:"physics",track:"world",year:1820,place:"哥本哈根",summary:"导线通电时旁边的小磁针偏转——电与磁第一次被联系起来。",detail:"据说是在讲座中偶然发现，但他立刻停下讲授去验证。偶然只奖励有准备的人。",sections:[{title:"讲座上的一次偶然",meta:"1820",body:"奥斯特在讲课时把通电导线靠近小磁针，磁针偏转了。他当场停下讲授，回去系统验证。"},{title:"为什么他能抓住",body:"他长期相信自然力之间存在统一性，一直在找电与磁的联系。偶然只奖励有准备的人。"},{title:"现象怎么描述",body:"电流方向改变，磁针偏转方向也改变；导线与磁针平行时偏转最大。他没有给出理论，但把现象钉死了。"},{title:"接下来的连锁反应",body:"安培几个月内给出数学描述，法拉第由此反向思考「磁能否生电」——二十年后得到了电磁感应。"}],textbooks:[{stage:"senior",module:"物理必修第三册",chapter:"第十三章 电磁感应与电磁波初步"}],tags:["电磁学","发现"]},{id:"w-ampere",title:"安培分子电流假说",kind:"theory",discipline:"physics",track:"world",year:1822,place:"巴黎",summary:"磁性的来源是物质内部的环形电流，而不是「磁荷」。",detail:"这把磁现象还原为电流，为法拉第的场与麦克斯韦的方程铺路。",sections:[{title:"奥斯特之后的混乱",meta:"1822",body:"现象被确认了，但没人说得清「为什么」。安培用数学把电流之间的作用力写成公式，让电磁学第一次可以计算。"},{title:"分子电流假说",body:"他提出磁性来自物质内部微小的环形电流，而不是独立的「磁荷」。这个想法两百年后被证明是对的：电子自旋与轨道运动。"},{title:"与法拉第的分歧",body:"安培重数学、重超距作用；法拉第重图像、重力线。两套语言长期并存，最后由麦克斯韦统一。"},{title:"一条被记住的定律",body:"安培环路定理把电流与磁场定量连起来，今天仍是电磁学的四块基石之一。"}],textbooks:[{stage:"senior",module:"物理必修第三册",chapter:"第十三章 电磁感应与电磁波初步"}],tags:["电磁学","还原"]},{id:"w-ohm",title:"欧姆定律",kind:"law",discipline:"physics",track:"world",year:1827,place:"科隆",summary:"电流与电压成正比、与电阻成反比——电路第一次可以算。",detail:"欧姆当时缺乏可靠电源与测量手段，实验精度被同行质疑了很多年。",sections:[{title:"困难在哪",meta:"1827",body:"当时没有稳定的电源，也没有可靠的电流计。欧姆只能自己做温差电池，用电流的热效应来间接测量。"},{title:"实验与结论",body:"他改变导线长度与粗细，发现电流与电压成正比、与电阻成反比。这就是 I = U/R。"},{title:"为什么被质疑多年",body:"他的测量精度受限于当时的仪器，同行难以重复。直到 1841 年英国皇家学会授予他科普利奖章，结论才被广泛接受。"},{title:"它管什么、不管什么",body:"欧姆定律适用于金属与电解液等线性元件。二极管、灯丝等非线性元件不服从这个比例关系。"}],textbooks:[{stage:"junior",module:"物理九年级全一册",chapter:"欧姆定律"},{stage:"senior",module:"物理必修第三册",chapter:"第十一章 电路及其应用"}],tags:["电路","定量"]},{id:"w-lenz",title:"楞次定律",kind:"law",discipline:"physics",track:"world",year:1834,place:"圣彼得堡",summary:"感应电流的方向总是阻碍引起它的磁通量变化——能量守恒在电磁学里的回声。",detail:"楞次定律本质上是能量守恒的推论：如果感应电流「帮助」变化，就能造出永动机。",sections:[{title:"法拉第留下了一个空白",meta:"1834",body:"法拉第知道变化会产生电流，但没说电流往哪个方向流。这个空白由楞次补上。"},{title:"判据",body:"感应电流的磁场总是阻碍引起它的磁通量变化。靠近时排斥，远离时吸引。"},{title:"为什么必然如此",body:"如果感应电流「帮助」变化，系统会自我加速，等于造出永动机。楞次定律本质上是能量守恒在电磁学里的表述。"},{title:"工程上的意义",body:"发电机、变压器、感应炉、电磁制动——所有利用感应的地方，都要按这条判据计算方向。"}],textbooks:[{stage:"senior",module:"物理选择性必修第二册",chapter:"第二章 电磁感应"}],tags:["电磁感应","能量"]},{id:"w-carnot",title:"卡诺热机理论",kind:"theory",discipline:"physics",track:"world",year:1824,place:"巴黎",summary:"热机效率只取决于两个热源的温度，与工质无关。",detail:"卡诺用「理想循环」剥离次要因素，这种理想化方法后来成为热力学的标准操作。",sections:[{title:"蒸汽机的效率问题",meta:"1824",body:"当时的蒸汽机效率极低，工程师们凭经验改进。卡诺想弄清楚：效率的上限由什么决定？"},{title:"理想循环",body:"他设想一个没有摩擦、没有热损失的可逆循环：等温膨胀、绝热膨胀、等温压缩、绝热压缩。效率只取决于两个热源的温度。"},{title:"可逆与不可逆",body:"卡诺发现不可逆过程会损失「可用功」。这个直觉后来被克劳修斯翻译成「熵增」。"},{title:"被埋没的十年",body:"他的书初版几乎无人问津，1832 年死于霍乱，手稿被烧。直到 1834 年克拉珀龙用图形重新表述，卡诺循环才被看见。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第三章 热力学定律"}],tags:["热力学","理想化"]},{id:"w-clausius",title:"热力学第二定律与熵",kind:"law",discipline:"physics",track:"world",year:1865,place:"波恩",summary:"孤立系统的熵不会减少，热不能自发从低温流向高温。",detail:"这是物理学里唯一给出「时间方向」的定律，也让「永动机不可能」有了严格表述。",sections:[{title:"接住卡诺的线",meta:"1865",body:"克劳修斯把卡诺循环与热功当量结合起来，指出热量不能自发从低温流向高温——这是第二定律的第一种表述。"},{title:"熵的引入",body:"他造了「熵」这个量：可逆过程中熵不变，不可逆过程中熵增加。孤立系统的熵永不减少。"},{title:"两种表述",body:"克劳修斯表述讲热的方向，开尔文表述讲热机效率不可能达到 100%。两者等价。"},{title:"热寂说的争议",body:"他推论宇宙的熵终将最大，一切归于死寂。这个「热寂说」引发了一百多年的争论，至今没有结论。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第三章 热力学定律"}],tags:["热力学","熵","时间箭头"]},{id:"w-boltzmann",title:"统计力学",kind:"theory",discipline:"physics",track:"world",year:1877,place:"维也纳",summary:"把宏观的热性质解释为大量分子运动的统计结果，熵与微观状态数挂钩。",detail:"S = k log W。当时很多物理学家不接受「原子只是统计虚构」，玻尔兹曼为此争论到生命尽头。",sections:[{title:"原子到底存不存在",meta:"1877",body:"十九世纪末，马赫与奥斯特瓦尔德都认为原子只是方便的说法。玻尔兹曼坚持：原子是真实的，热就是它们的运动。"},{title:"S = k log W",body:"他把熵与微观状态数联系起来：系统越无序，可能的微观排列越多，熵越大。这条公式刻在他的墓碑上。"},{title:"可逆佯谬",body:"洛施密特质疑：微观运动方程可逆，宏观怎么会不可逆？玻尔兹曼的回答是概率——熵增不是绝对必然，而是几乎必然。"},{title:"余音",body:"1906 年他自杀身亡。两年后，佩兰用布朗运动实验测出阿伏伽德罗常数，原子论成为共识。"}],textbooks:[{stage:"advanced",module:"大学先修·统计物理"}],tags:["统计","熵"]},{id:"w-hertz",title:"赫兹验证电磁波",kind:"experiment",discipline:"physics",track:"world",year:1888,place:"卡尔斯鲁厄",summary:"用火花隙产生并接收到电磁波，证实了麦克斯韦的预言。",detail:"赫兹本人说「我看不出有什么用」——三十年后无线电改变了世界。",sections:[{title:"一个悬了二十三年的预言",meta:"1888",body:"麦克斯韦 1865 年就预言了电磁波，但没人见过。赫兹要做的，是把它从方程里「抓」出来。"},{title:"火花隙装置",body:"用感应圈给两个小球加高压，间隙跳火时产生高频振荡；几米外用同样的间隙做接收器，也能看到微弱火花。"},{title:"他为什么说「没什么用」",body:"赫兹认为这只是验证理论，看不出实际用途。三十年后无线电广播改变了世界。"},{title:"留下的问题",body:"他证明了电磁波存在，却没解释它如何在空间传播——这个问题把物理学推向了「以太」的困境，也推向了相对论。"}],textbooks:[{stage:"senior",module:"物理选择性必修第二册",chapter:"第四章 电磁振荡与电磁波"}],tags:["电磁波","验证"]},{id:"w-fission",title:"核裂变的发现",kind:"experiment",discipline:"physics",track:"world",year:1938,place:"柏林",summary:"用中子轰击铀，得到质量更小的钡——原子核可以分裂并释放巨大能量。",detail:"哈恩与施特拉斯曼的化学分析给出证据，迈特纳用「液滴模型」解释了能量来源。",sections:[{title:"一次「不该有」的结果",meta:"1938",body:"哈恩与施特拉斯曼用中子轰击铀，本以为会得到镭一类的重元素，化学分析却显示产物是钡——原子量只有铀的一半。作为化学家，他们相信自己的分析；作为物理学家，他们不敢相信这个解释。"},{title:"液滴模型怎么解释",body:"迈特纳与弗里施借用玻尔的「液滴模型」：铀核像一滴带电的液滴，吸收中子后开始振荡，形变足够大时，静电斥力会把它撕成两半，同时释放约 200 MeV 的能量。"},{title:"为什么改变世界",body:"裂变释放的能量比化学反应大数百万倍；更关键的是，每次裂变还会放出 2—3 个中子，可能引发链式反应。这一条推论把物理学直接推到了政治面前。"},{title:"余音",body:"1938 年 12 月，哈恩把实验结果写信寄给已流亡瑞典的迈特纳。解释这个结果的，正是她。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第五章 原子核"}],tags:["核物理","裂变"]},{id:"w-fermi",title:"第一座核反应堆",kind:"experiment",discipline:"physics",track:"world",year:1942,place:"芝加哥",summary:"芝加哥一号堆实现可控链式反应，人类第一次驾驭核能。",detail:"费米团队在球场看台下用石墨与铀块堆出「临界」，这是理论物理走向工程的标志性时刻。",sections:[{title:"裂变之后的问题",meta:"1942",body:"每次裂变放出 2—3 个中子，理论上可以引发链式反应。但中子跑得太快，必须让它们慢下来才容易再击中铀核。"},{title:"减速剂的选择",body:"费米选石墨而不是重水——重水在战时难以获得。纯石墨需要极高纯度，早期失败正是因为杂质吸收中子。"},{title:"芝加哥一号堆",body:"在球场看台下，用石墨砖与铀块堆成一个「堆」，插入镉棒控制中子数。1942 年 12 月 2 日，它首次达到临界。"},{title:"从实验室到曼哈顿",body:"这次成功直接支撑了后来的反应堆与钚生产。人类第一次学会控制核能释放的速率。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"第五章 原子核"}],tags:["核能","工程"]},{id:"w-schrodinger",title:"薛定谔方程",kind:"theory",discipline:"physics",track:"world",year:1926,place:"苏黎世",summary:"用一个波动方程描述粒子的状态演化，量子力学有了可计算的骨架。",detail:"与海森堡的矩阵力学等价但形式不同。薛定谔的「猫」把测量问题摆上了台面。",sections:[{title:"德布罗意留下的缺口",meta:"1926",body:"物质波被提出后，没人知道它服从什么方程。薛定谔在阿尔卑斯山度假时找到了它。"},{title:"波动方程",body:"他写出一个描述波函数随时间演化的方程。解出的能级恰好对上氢原子的光谱——理论第一次自己长出了实验数据。"},{title:"与矩阵力学等价",body:"海森堡用矩阵、薛定谔用波函数，两种形式在数学上等价。物理学家用波函数，因为它更好算。"},{title:"那只猫",body:"波函数意味着叠加态。薛定谔用「既死又活的猫」讽刺这个结论，没想到它成了量子力学最著名的思想实验。"}],textbooks:[{stage:"advanced",module:"大学先修·量子力学初步"}],tags:["量子力学","方程"]},{id:"w-transistor",title:"晶体管的发明",kind:"invention",discipline:"physics",track:"world",year:1947,place:"贝尔实验室",summary:"用半导体放大电信号，取代了笨重的电子管，信息时代由此开始。",detail:"巴丁、布拉顿、肖克利的工作建立在固体物理与材料提纯的长期积累上，是「基础研究—产业」的典型链条。",sections:[{title:"取代电子管",meta:"1947",body:"电子管体积大、发热多、易坏。贝尔实验室想找一种固态器件来放大信号。"},{title:"点接触晶体管",body:"巴丁与布拉顿用两根金属针接触锗晶体，做出第一个能放大的晶体管。肖克利随后发明更可靠的结型晶体管。"},{title:"为什么是革命",body:"它小、省电、可靠，还能大规模制造。此后的集成电路、微处理器、手机，都建立在它之上。"},{title:"一个遗憾",body:"肖克利离开贝尔实验室创办公司，却管理失败，导致「八叛逆」出走，创办了仙童半导体——硅谷由此开始。"}],textbooks:[{stage:"senior",module:"物理选择性必修第二册",chapter:"",note:"拓展内容"}],tags:["半导体","信息"]},{id:"w-laser",title:"激光的诞生",kind:"invention",discipline:"physics",track:"world",year:1960,place:"休斯实验室",summary:"受激辐射产生高度相干的光，从测距到手术都被改写。",detail:"爱因斯坦 1917 年就预言了受激辐射，四十年后才在红宝石上变成现实。",sections:[{title:"爱因斯坦的预言",meta:"1917",body:"他提出受激辐射：一个光子遇到激发态原子，会诱发它放出同频同相的光子。这是激光的理论种子。"},{title:"从微波到光",body:"1954 年汤斯做出微波激射器（maser）。1960 年梅曼用红宝石棒得到第一束激光。"},{title:"它特别在哪",body:"普通光方向杂乱、相位不一；激光单色、相干、方向集中，能聚焦到极小的点，也能传播极远。"},{title:"谁发明了它",body:"梅曼先做出来，但戈登·古尔德更早写下原理并申请专利，汤斯与肖洛也有基础贡献。专利战打了三十年。"}],textbooks:[{stage:"senior",module:"物理选择性必修第一册",chapter:"第四章 光"}],tags:["光学","相干"]},{id:"w-superconductivity",title:"超导现象",kind:"experiment",discipline:"physics",track:"world",year:1911,place:"莱顿",summary:"汞在 4.2 K 附近电阻骤降为零，量子现象在宏观尺度上显现。",detail:"昂内斯发现后，直到 1957 年 BCS 理论才解释清楚。它后来支撑了核磁共振、粒子加速器与磁悬浮。",sections:[{title:"零电阻",meta:"1911",body:"昂内斯把汞冷却到 4.2 K，电阻突然降到零——不是变小，是测不出来。电流可以在超导环里持续数年不衰减。"},{title:"迈斯纳效应",body:"1933 年发现：超导体不只零电阻，还会把磁场排出体外。这使它能让磁铁悬浮——磁悬浮列车的基础。"},{title:"等了四十六年",body:"从 1911 到 1957，没人说得清机理。BCS 理论用「电子对」解释：两个电子通过晶格振动间接吸引，结成库珀对。"},{title:"高温超导",body:"1986 年发现铜氧化物在液氮温度以上超导，引发热潮。机理至今没有共识——这是凝聚态物理最大的悬案之一。"}],textbooks:[{stage:"senior",module:"物理选择性必修第三册",chapter:"",note:"拓展内容"}],tags:["低温","量子"]},{id:"cn-zu-chongzhi",title:"祖冲之与圆周率",kind:"concept",discipline:"math",track:"cn",year:480,place:"建康",summary:"约公元 480 年，把圆周率算到小数点后七位，精度领先世界近千年。",detail:"用「割圆术」不断逼近，本质上是极限思想的雏形。天文历法与建筑工程都需要这种精度。",sections:[{title:"接住刘徽的方法",meta:"约 480",body:"祖冲之沿用割圆术，但把正多边形算到了 12288 边甚至更多。他给出 3.1415926 < π < 3.1415927。"},{title:"不只是圆周率",body:"他编《大明历》，首次把岁差引入历法，算出一年 365.2428 日；还造过指南车、千里船。"},{title:"这个精度意味着什么",body:"此后近千年，没有更精确的记录。直到 15 世纪，阿拉伯数学家阿尔·卡西才超过他。"},{title:"他的书失传了",body:"《缀术》在唐代还是教材，宋代以后失传。我们今天知道他，靠的是《隋书》等史书的转述——连方法细节都没留下。"}],textbooks:[{stage:"junior",module:"数学六年级上册",chapter:"第五单元 圆"}],tags:["数学","历法"]},{id:"cn-guo-shoujing",title:"郭守敬与《授时历》",kind:"work",discipline:"physics",track:"cn",year:1281,place:"大都",summary:"测定一年长度为 365.2425 日，与今天公历几乎一致。",detail:"为编历自制简仪、高表等仪器，进行大规模天文测量——观测精度支撑了历法精度。",sections:[{title:"一部历法的精度",meta:"1281",body:"《授时历》定一年为 365.2425 日，与今天公历几乎一致，却比欧洲格里历早了三百年。"},{title:"仪器革新",body:"郭守敬造简仪、高表、仰仪，简化了传统浑仪的结构，减少了多重环圈带来的误差。"},{title:"全国测量",body:"元朝设二十七处观测点，南到南海，北到西伯利亚。大规模实测为历法提供了数据基础。"},{title:"影响",body:"《授时历》沿用三百多年，还传入朝鲜与日本。它的精度来自「更大的观测网 + 更好的仪器」，而不是更聪明的公式。"}],textbooks:[{stage:"senior",module:"物理必修第二册",chapter:"第七章 万有引力与宇宙航行"}],tags:["天文","历法"]},{id:"cn-xu-guangqi",title:"徐光启译《几何原本》",kind:"work",discipline:"math",track:"cn",year:1607,place:"北京",summary:"与利玛窦合译前六卷，把演绎体系第一次系统引入中文。",detail:"「几何」「点」「线」「面」这些译名沿用至今。它带来的不只是知识，还有「从公理推出结论」的方法。",sections:[{title:"一次合作",meta:"1607",body:"徐光启与利玛窦在北京相识。利玛窦带来《几何原本》的拉丁文本，徐光启提议：把它译成中文。"},{title:"译了多久",body:"两人每天下午对译，利玛窦口述，徐光启笔录润色，几个月完成前六卷。后九卷要等两百多年后的李善兰。"},{title:"造出来的词",body:"「几何」「点」「线」「面」「直角」「钝角」「平行线」——这些词都是那时定下的，沿用至今，还传到日本、朝鲜。"},{title:"为什么只译六卷",body:"徐光启想译完，利玛窦认为先译六卷足够。也有人说，后九卷涉及数论与立体几何，当时的中国读者还接不住。"}],textbooks:[{stage:"junior",module:"数学八年级上册",chapter:"第十二章 全等三角形"}],tags:["译介","几何","明末"]},{id:"cn-yang-lee",title:"宇称不守恒",kind:"theory",discipline:"physics",track:"cn",year:1956,place:"普林斯顿",summary:"杨振宁与李政道提出弱相互作用中宇称不守恒，颠覆了「镜像对称」的直觉。",detail:"他们提出可检验的方案，次年即被吴健雄的实验证实，同年获诺贝尔物理学奖。",sections:[{title:"一个被默认的对称性",meta:"1956",body:"宇称守恒意味着物理规律在镜像下不变。它被视为理所当然，从未被严格检验——尤其在弱相互作用中。"},{title:"提出可检验的判据",body:"他们没有停在哲学讨论，而是给出一个能被实验判决的判据。至于怎么把原子核排列整齐、怎么测出不对称，交给实验物理学家。"},{title:"一年后被证实",body:"吴健雄的实验证实了宇称不守恒。两人于 1957 年获诺贝尔物理学奖，从论文到获奖仅一年。"},{title:"更大的遗产",body:"杨-米尔斯规范场论（1954）后来成为粒子物理标准模型的骨架。它的重要性，甚至超过宇称不守恒。"}],textbooks:[{stage:"advanced",module:"大学先修·近代物理"}],tags:["粒子物理","对称性"]},{id:"cn-wu-chien-shiung",title:"吴健雄的宇称实验",kind:"experiment",discipline:"physics",track:"cn",year:1957,place:"纽约",summary:"用钴-60 的 β 衰变证明左右不对称，实验物理学的一座里程碑。",detail:"她把样品冷却到接近绝对零度并极化原子核，技术难度极高。理论与实验的互相成全在这里格外清楚。",sections:[{title:"把原子核排好队",meta:"1957",body:"要检验宇称，先要让钴-60 的核自旋方向一致。她在极低温下用磁场极化，技术难度极高。"},{title:"测什么",body:"看 β 射线更多射向自旋的哪一侧。结果明显不对称——镜像世界与我们的世界不一样。"},{title:"未获诺奖的争议",body:"1957 年诺贝尔奖只颁给杨振宁与李政道，吴健雄未在其中。这在物理学界长期被视为不公。"},{title:"她的风格",body:"「原子核物理女王」。她以实验严谨著称，从不发表未经验证的结果。"}],textbooks:[{stage:"advanced",module:"大学先修·近代物理"}],tags:["实验","对称性"]},{id:"cn-qian-xuesen",title:"钱学森与工程控制论",kind:"work",discipline:"physics",track:"cn",year:1954,place:"洛杉矶",summary:"把控制理论系统化到工程尺度，为航天与导弹提供了方法论。",detail:"他回国后主持「两弹一星」的技术路线设计，是科学家与工程组织者双重角色的样本。",sections:[{title:"从加州理工出发",meta:"1954",body:"钱学森师从冯·卡门，参与喷气推进研究，是当时美国火箭领域的顶尖学者之一。"},{title:"《工程控制论》",body:"他把控制理论从数学概念变成工程方法：系统如何稳定、如何反馈、如何优化。这本书成了自动控制领域的经典。"},{title:"回国",body:"1955 年他辗转回国，随后主持导弹与航天事业。他带来的不只是知识，还有「总体设计部」这种组织方法。"},{title:"两弹一星",body:"他把成千上万个环节组织成一个系统：谁负责什么、如何接口、如何验收。大科学工程的核心，正是这种系统工程能力。"}],textbooks:[{stage:"advanced",module:"大学先修·工程物理"}],tags:["控制论","航天"]}],D0=[{id:"w-boyle",title:"波义耳的元素定义",kind:"theory",discipline:"chemistry",track:"world",year:1661,place:"牛津",summary:"把「元素」定义为不能再分解的物质，化学从炼金术里独立出来。",detail:"《怀疑的化学家》主张以实验检验而非权威论断，这一定义为后来的定量化学留好了位置。",sections:[{title:"此前的主流",meta:"1661",body:"炼金术传统认为万物由火、气、水、土四元素组成，或者由硫、汞、盐三要素构成。这些说法无法检验。"},{title:"波义耳的定义",body:"元素是「不能用化学方法再分解的、最单纯的物质」。这个定义把元素从哲学概念变成了实验对象。"},{title:"《怀疑的化学家》",body:"他以对话体质疑当时的各种元素说，主张用实验而不是权威来判定。这本书让化学从炼金术的附属品里独立出来。"},{title:"局限",body:"波义耳仍相信燃素说，也没有给出元素的完整清单。真正的元素分类要等拉瓦锡与道尔顿。"}],textbooks:[{stage:"junior",module:"化学九年级上册",chapter:"物质构成的奥秘"}],tags:["元素","化学独立"]},{id:"w-kekule",title:"苯的环状结构",kind:"theory",discipline:"chemistry",track:"world",year:1865,place:"根特",summary:"提出苯的六元环交替双键结构，有机化学第一次能「画出」分子。",detail:"结构式让同分异构现象变得可推理，有机合成从此有了蓝图。",sections:[{title:"苯的分子式难题",meta:"1865",body:"苯的实验式是 CH，分子式是 C₆H₆——碳的化合价是 4，六个碳、六个氢，怎么排都不够用。"},{title:"环状结构",body:"凯库勒提出六个碳连成环、单双键交替。这样每个碳正好四价，也解释了苯的稳定性与取代反应。"},{title:"那个「梦见蛇咬尾巴」的传说",body:"凯库勒晚年确实讲过梦见衔尾蛇的轶事，但史料可信度不高。更可靠的是：他长期思考碳链与碳环，结构是推出来的。"},{title:"影响",body:"结构式让有机分子可以「画」出来，同分异构、反应机理从此有了推理工具。"}],textbooks:[{stage:"senior",module:"化学选择性必修第三册",chapter:"第二章 烃"}],tags:["有机","结构"]},{id:"w-vant-hoff",title:"碳的四面体构型",kind:"theory",discipline:"chemistry",track:"world",year:1874,place:"乌得勒支",summary:"碳原子四个键指向正四面体顶点，解释了旋光异构。",detail:"这是化学第一次真正进入三维。范特霍夫与勒贝尔各自独立提出，最初被同行嘲讽为「奇幻」。",sections:[{title:"碳的四个键不在一个平面上",meta:"1874",body:"当时的结构式把碳画成平面。范特霍夫提出：四个键指向正四面体的顶点。这个想法解释了为什么有些分子有旋光性。"},{title:"旋光异构",body:"同一分子式、同样的键，却有两种互为镜像的结构，像左右手。它们的物理性质几乎相同，但旋光方向相反——这是平面结构解释不了的。"},{title:"被嘲讽",body:"他的荷兰语小册子最初被同行讥为「奇幻」。十年后，立体化学成为有机化学的基础。"},{title:"影响",body:"第一个诺贝尔化学奖（1901）颁给了他。今天药物设计里，手性都是必须考虑的问题——沙利度胺的悲剧就是反例。"}],textbooks:[{stage:"senior",module:"化学选择性必修第二册",chapter:"第二章 分子结构与性质"}],tags:["立体化学","结构"]},{id:"w-gibbs",title:"化学热力学与相律",kind:"theory",discipline:"chemistry",track:"world",year:1876,place:"纽黑文",summary:"用自由能判断反应能否自发，把化学平衡纳入热力学框架。",detail:"吉布斯的工作当年几乎无人读懂，却在二十年后成为物理化学的支柱。",sections:[{title:"判断反应能否自发",meta:"1876",body:"放热反应不一定自发，吸热反应也可能自发。吉布斯提出用自由能 G = H − TS 来判断：自由能降低的过程才自发。"},{title:"相律",body:"他给出相律 f = C − P + 2，用组分数与相数算出自由度。冶金、盐湖、合金研究都靠它判断条件。"},{title:"为什么当年没人读懂",body:"论文发表在地方科学院的会刊上，用大量热力学记号、篇幅极长。欧洲同行几乎无人引用。"},{title:"后来",body:"二十年后，奥斯特瓦尔德把它译成德文并大力推广。今天物理化学的每一本教材都从自由能讲起。"}],textbooks:[{stage:"senior",module:"化学选择性必修第一册",chapter:"第二章 化学反应速率与化学平衡"}],tags:["热力学","自由能"]},{id:"w-nernst",title:"能斯特方程",kind:"law",discipline:"chemistry",track:"world",year:1889,place:"哥廷根",summary:"把电极电势与离子浓度连起来，电池电压第一次可以算。",detail:"它让电化学从经验走向定量，也是后来 pH 计、传感器与腐蚀研究的理论基础。",sections:[{title:"电极电势随浓度变",meta:"1889",body:"同一个电池，电解质浓度不同，电压也不同。能斯特要找出这个关系的数学形式。"},{title:"能斯特方程",body:"E = E° − (RT/nF) ln Q。温度、转移电子数、浓度商都在里面。浓度变化一个数量级，电势差约 59 mV（25℃）。"},{title:"它解决了什么",body:"它把热力学的自由能与电化学的电压连起来，让电池设计从试错变成计算。"},{title:"应用",body:"pH 计、离子选择性电极、腐蚀与电镀。它也是理解生物电信号的基础。"}],textbooks:[{stage:"senior",module:"化学选择性必修第一册",chapter:"第四章 化学反应与电能"}],tags:["电化学","定量"]},{id:"w-lewis",title:"化学键的电子对理论",kind:"theory",discipline:"chemistry",track:"world",year:1916,place:"伯克利",summary:"共价键是共享电子对，路易斯结构式从此成为化学的共同语言。",detail:"他把「键」画成了可数的电子对，让分子结构可以推理、可以教学。",sections:[{title:"键到底是什么",meta:"1916",body:"离子键好理解：正负相吸。但两个氯原子为什么能结合成 Cl₂？没有正负之分，靠什么？"},{title:"共享电子对",body:"路易斯提出：共价键是两个原子共享一对电子。他用点表示价电子，画出了至今仍在课本上的「路易斯结构式」。"},{title:"八隅体规则",body:"原子倾向于通过共享或转移电子，达到最外层 8 个电子的稳定结构。这条经验规则解释了绝大多数主族化合物的成键。"},{title:"通往量子化学",body:"路易斯的电子对是经典图像。鲍林后来用量子力学重新解释共价键，但「电子对」这个直觉一直有用。"}],textbooks:[{stage:"senior",module:"化学选择性必修第二册",chapter:"第二章 分子结构与性质"}],tags:["化学键","结构式"]},{id:"w-isotope",title:"同位素的发现",kind:"experiment",discipline:"chemistry",track:"world",year:1913,place:"格拉斯哥",summary:"同一元素可以有不同质量，索迪提出「同位素」概念。",detail:"它解释了原子量为何不是整数，也为示踪、核能与质谱分析打开大门。",sections:[{title:"原子量为什么不是整数",meta:"1913",body:"氖的原子量是 20.18，不是整数。索迪提出：同一元素可以有质量不同的原子，它们化学性质相同。"},{title:"质谱的证据",body:"汤姆孙与阿斯顿用质谱把氖分成 20 与 22 两条线——同位素第一次被「看见」。"},{title:"命名",body:"「同位素」（isotope）意为「同一位置」：在周期表上占据同一个格子。"},{title:"影响",body:"同位素示踪、放射性定年、核能与质谱分析，都从这里开始。它也解释了「平均原子量」的含义。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第四章 物质结构 元素周期律"}],tags:["原子","核素"]},{id:"w-pauling",title:"杂化轨道与化学键本质",kind:"theory",discipline:"chemistry",track:"world",year:1931,place:"帕萨迪纳",summary:"用量子力学解释碳的四个等价键，化学键第一次有了量子基础。",detail:"鲍林把量子力学翻译成化学家能用的语言，1962 年因化学键研究获诺贝尔化学奖。",sections:[{title:"碳的四价之谜",meta:"1931",body:"范特霍夫用四面体解释了碳的骨架，却没有说明电子为什么那样排布。2s 与 2p 轨道形状差别很大，凭什么四根键完全等价？"},{title:"杂化",body:"鲍林提出：2s 与 2p 轨道可以混合成四个等价的 sp³ 杂化轨道，指向正四面体的四个顶点。这解释了甲烷的结构。"},{title:"共振",body:"他还用「共振」处理苯这类结构——真实分子是几个共振式的叠加，而不是其中某一个。"},{title:"影响",body:"鲍林把量子力学翻译成化学家能用的语言，1954 年获诺贝尔化学奖；后来他又因反对核试验获和平奖。"}],textbooks:[{stage:"senior",module:"化学选择性必修第二册",chapter:"第二章 分子结构与性质"}],tags:["量子化学","化学键"]},{id:"w-haber",title:"合成氨与哈伯法",kind:"invention",discipline:"chemistry",track:"world",year:1909,place:"卡尔斯鲁厄",summary:"用高温高压与催化剂把氮气变成氨，人类第一次「从空气里造出肥料」。",detail:"它养活了数十亿人，也在两次世界大战中成为炸药原料——同一技术的一体两面。",sections:[{title:"氮固定的难题",meta:"1909",body:"空气里 78% 是氮，但氮气极稳定，植物无法直接利用。如何把 N₂ 变成氨，是 20 世纪初的「世纪难题」。"},{title:"催化剂与高压",body:"哈伯用铁基催化剂、高温高压让氮与氢反应。博施解决了工程放大与耐压设备问题，1913 年实现工业化。"},{title:"平衡与速率的矛盾",body:"合成氨放热，低温有利于平衡但速率太慢；高温快但转化率低。工业上取 400—500℃、高压，并循环未反应气体。"},{title:"双刃剑",body:"它养活了数十亿人，也让德国在战时获得炸药原料。同一项技术的两面性，是科学伦理的经典案例。"},{title:"余音",body:"1918 年的诺贝尔化学奖颁给了他。同一条工艺的另一端，正在制造填满战壕的炸药。"}],textbooks:[{stage:"senior",module:"化学选择性必修第一册",chapter:"第二章 化学反应速率与化学平衡"}],tags:["催化","工业","平衡"]},{id:"w-bakelite",title:"酚醛塑料",kind:"invention",discipline:"chemistry",track:"world",year:1907,place:"纽约",summary:"第一种完全人工合成的塑料，材料从此不再依赖天然物。",detail:"贝克兰德把酚与甲醛缩聚成热固性树脂，开启了高分子材料时代。",sections:[{title:"第一种合成塑料",meta:"1907",body:"在此之前，塑料只有赛璐珞这类半天然材料。贝克兰德想找一种绝缘材料替代虫胶，结果得到了一种全新的物质。"},{title:"缩聚反应",body:"苯酚与甲醛在加热与催化下缩合，分子链不断交联，最终形成一个巨大的三维网络。这就是「热固性」——加热也不会熔化。"},{title:"它改变了什么",body:"电插座、电话机壳、齿轮、胶木把手。材料第一次可以「按需设计」，而不是从自然界挑选。"},{title:"材料时代",body:"此后尼龙、聚乙烯、聚氯乙烯陆续出现。20 世纪被称为「塑料的时代」，也留下了今天的白色污染问题。"}],textbooks:[{stage:"senior",module:"化学选择性必修第三册",chapter:"第五章 合成高分子"}],tags:["高分子","材料"]},{id:"w-davy",title:"电解制取活泼金属",kind:"experiment",discipline:"chemistry",track:"world",year:1807,place:"伦敦",summary:"用电解熔融碱得到钠和钾，证明「活泼金属」可以被化学手段分离。",detail:"戴维的方法把电与化学连在一起，为铝、镁等金属的工业化开辟了道路。",sections:[{title:"电池带来的新工具",meta:"1807",body:"伏打电堆出现后，化学家手里第一次有了持续电流。戴维立刻想到：能不能用它把最稳定的化合物拆开？"},{title:"电解熔融碱",body:"他把氢氧化钾加热熔融，通上电流，在阴极得到一种银白色金属——钾。几周后又得到钠。此前没人相信这些金属能单独存在。"},{title:"一个「疯狂」的实验者",body:"戴维还试过电解氨、电解土类，甚至用自己吸入笑气做实验。他的风格是先把事情做出来，再慢慢解释。"},{title:"影响",body:"电解法从此成为制备活泼金属的标准手段。铝、镁、钠的工业化，都沿着这条路。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第二章 海水中的重要元素——钠和氯"}],tags:["电解","金属"]},{id:"w-bunsen",title:"光谱分析",kind:"experiment",discipline:"chemistry",track:"world",year:1859,place:"海德堡",summary:"每种元素有独特的光谱线，凭光就能认出元素——铯、铷由此发现。",detail:"光谱分析让「看不见的原子」变得可辨识，也把天文学与化学连成了天体化学。",sections:[{title:"本生灯与干净的火焰",meta:"1859",body:"本生改良了煤气灯，让火焰几乎无色、温度更高。这为观察物质的焰色提供了干净背景。"},{title:"谱线像指纹",body:"基尔霍夫提出：每种元素在高温下发出特定波长的光。把光通过棱镜，就得到一组线——元素的「指纹」。"},{title:"发现铯与铷",body:"他们从矿泉水中分离出两种新元素，取名铯（天蓝）与铷（深红），名字就来自谱线颜色。"},{title:"从地球到恒星",body:"光谱分析很快被用于天文：太阳上的氦，就是先在日光谱里发现、后在地球上找到的。化学与天文学由此联姻。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第四章 物质结构 元素周期律"}],tags:["光谱","分析"]},{id:"cn-papermaking",title:"造纸术",kind:"invention",discipline:"technology",track:"cn",year:105,place:"洛阳",summary:"蔡伦改进造纸，用树皮麻头等原料制浆抄纸，知识复制成本骤降。",detail:"打浆、抄造、晾晒是一整套化学与机械工艺。纸张西传后，成为欧洲印刷术与科学革命的物质前提。",sections:[{title:"蔡伦之前就有纸",meta:"105",body:"考古发现西汉已有麻纸。蔡伦的贡献是改进工艺、扩大原料、提高质量，让纸真正可以替代竹简与缣帛。"},{title:"工艺的关键",body:"把树皮、麻头、破布、旧渔网切碎、浸泡、蒸煮，让纤维分离；再打浆、抄纸、压榨、晾干。核心是「让纤维重新交织成薄层」。"},{title:"为什么它改变历史",body:"纸让知识复制的成本骤降。此前一部书要抄在竹简上，此后可以大量传抄——印刷术之所以能掀起革命，前提是有便宜的纸。"},{title:"传播路线",body:"造纸术经阿拉伯传入欧洲，当地第一家纸厂出现在 12 世纪的西班牙。此后欧洲的大学、印刷所才有充足的书写材料。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第八章 化学与可持续发展"}],tags:["工艺","传播"]},{id:"cn-porcelain",title:"瓷器的烧制",kind:"invention",discipline:"technology",track:"cn",year:200,place:"浙江上虞、越窑",summary:"东汉晚期烧出成熟青瓷，高温窑炉与釉料配方把硅酸盐化学做到了极致。",detail:"控制窑温与还原气氛需要长期经验积累。此后唐代白瓷、宋代名窑将这套工艺推向高峰，瓷器也成为古代中国最具技术含量的出口商品之一。",sections:[{title:"从陶到瓷",meta:"约 200",body:"陶器烧成温度低、吸水率高；瓷器要烧到 1200℃ 以上，胎体致密、几乎不吸水。差别在原料与窑温。"},{title:"高温窑的技术",body:"龙窑依山而建，利用坡度自然抽风，能把温度稳定在 1200℃ 以上。控制还原气氛，才能烧出青瓷的青色。"},{title:"从青瓷到白瓷",body:"东汉晚期出现成熟青瓷；唐代邢窑白瓷、宋代汝官哥定钧各具特色。釉料配方与窑炉气氛的微小差别，决定成品的天壤之别。"},{title:"贸易与技术外流",body:"瓷器长期是中国最重要的出口商品。欧洲人直到 18 世纪才在德国烧出真正的硬质瓷——此前他们只能仿制。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第五章 化工生产中的重要非金属元素"}],tags:["硅酸盐","窑炉"]},{id:"cn-fan-xudong",title:"范旭东与永利碱厂",kind:"invention",discipline:"chemistry",track:"cn",year:1917,place:"塘沽",summary:"创办永利制碱，打破外资垄断，为侯德榜的技术攻关提供了工业平台。",detail:"范旭东是企业家，侯德榜是技术负责人——现代工业需要这两种角色的配合。",sections:[{title:"一个企业家的选择",meta:"1917",body:"范旭东留学日本学化学，回国后办精盐厂，又决定做一件更难的事：制碱。当时中国纯碱几乎全靠进口。"},{title:"永利碱厂",body:"他在塘沽建厂，设备、技术、人才都要自己解决。早期产品质量不过关，一度濒临破产。"},{title:"与侯德榜的合作",body:"他请侯德榜主持技术，两人一个管经营、一个管研发。1926 年「红三角」纯碱投产，在国际博览会上获奖。"},{title:"意义",body:"它证明了中国资本与技术可以进入基础化工。更重要的是，它培养了一支后来支撑整个行业的队伍。"}],textbooks:[{stage:"senior",module:"化学必修第二册",chapter:"第五章 化工生产中的重要非金属元素"}],tags:["工业","自主"]},{id:"cn-insulin",title:"人工合成牛胰岛素",kind:"invention",discipline:"chemistry",track:"cn",year:1965,place:"上海、北京",summary:"世界上首次用化学方法合成有生物活性的蛋白质，195 个氨基酸的连接。",detail:"在设备与信息都极有限的条件下完成，靠的是多单位协作与极致的分工。",sections:[{title:"1958 年的决定",meta:"1965",body:"胰岛素是当时唯一被确定氨基酸序列的蛋白质。中国科学家决定：用化学方法把它全合成出来。"},{title:"拆成三条路",body:"先把 A、B 两条链分别合成，再通过二硫键连接。每一步都要分离、纯化、鉴定，工作量以年计。"},{title:"1965 年 9 月",body:"产物在动物实验中表现出完整的生物活性。这是世界上第一次人工合成蛋白质。"},{title:"遗憾与影响",body:"由于当时未开放国际交流，这项成果未获诺贝尔奖。但它训练了一整代多肽化学人才，也为后来的基因工程铺了路。"}],textbooks:[{stage:"senior",module:"化学选择性必修第三册",chapter:"第四章 生物大分子"}],tags:["蛋白质","有机合成"]},{id:"cn-xu-guangxian",title:"徐光宪与稀土分离",kind:"invention",discipline:"chemistry",track:"cn",year:1976,place:"北京",summary:"提出串级萃取理论，把化学性质极相似的稀土元素高效分离。",detail:"稀土被称为「工业维生素」，分离技术长期是瓶颈。这套理论让中国从卖原矿变成掌握分离能力。",sections:[{title:"稀土为什么难分",meta:"1976",body:"十七种稀土元素化学性质极其相似，常常伴生在一起。分离它们需要成百上千次萃取，成本高得离谱。"},{title:"串级萃取",body:"徐光宪把分离过程抽象成数学模型，算出需要多少级、每级什么条件，用「理论级数」替代盲目试错。"},{title:"从理论到产业",body:"这套方法在全国推广后，稀土分离成本大幅下降。中国从卖原矿变成掌握分离技术的国家。"},{title:"一个提醒",body:"技术优势不等于产业优势。稀土的故事里，既有科学，也有资源、环境与国际博弈。"}],textbooks:[{stage:"advanced",module:"大学先修·分离科学"}],tags:["萃取","稀土"]},{id:"cn-zhang-qinglian",title:"张青莲与原子量测定",kind:"experiment",discipline:"chemistry",track:"cn",year:1991,place:"北京",summary:"用质谱法精确测定铟等多种元素的原子量，被国际纯粹与应用化学联合会采纳为新标准。",detail:"原子量是化学计量的基石，一个数字的修正会影响全世界的教材与实验。",sections:[{title:"原子量为什么还要测",meta:"1991",body:"原子量是化学计量的基准。国际纯粹与应用化学联合会（IUPAC）每两年发布一次标准值，各国实验室都在竞争「提供数据」。"},{title:"质谱法",body:"张青莲团队用高精度质谱测定同位素丰度，再算出平均原子量。难点在提纯样品与校正系统误差。"},{title:"铟与锑",body:"他测定的铟、锑等原子量被 IUPAC 采纳为新标准。一个数字的修正，会影响全世界的教材与试剂标签。"},{title:"意义",body:"在基础数据领域，中国从「使用者」变成了「提供者」。这类工作不显眼，但它是所有定量化学的地基。"}],textbooks:[{stage:"senior",module:"化学必修第一册",chapter:"第二章 海水中的重要元素——钠和氯"}],tags:["质谱","原子量"]}],C0={"cz-prehistory":{module:"中外历史纲要（上）",chapter:"第1课 中华文明的起源与早期国家"},"h-yangshao":{module:"中外历史纲要（上）",chapter:"第1课 中华文明的起源与早期国家"},"h-lia
